    const fm = CONFIG.formatos;
    if (fm && fm.itens && fm.itens.length) {
      $("#formatosCabecalho").innerHTML = cabecalho(fm, "titulo-formatos");
      const total = fm.itens.length;
      const icone = (f) => iconesFormato[f.icone] || iconesFormato.vlog;
      $("#formatosAbas").innerHTML = fm.itens.map((f, i) =>
        `<button type="button" class="formato-aba" data-formato="${i}" aria-pressed="false">${icone(f)}<span>${esc(f.nome)}</span></button>`).join("");

      // vídeo de exemplo: YouTube abre dentro do site; outros links abrem em nova aba; vazio mostra "vídeo em breve"
      function videoFormato(f) {
        const id = idYoutube(f.video || "");
        if (id) {
          // "imagem" no formato = capa própria (ex.: "fotos/minha-capa.png"); vazio = capa do YouTube
          const capa = f.imagem
            ? { imagem: f.imagem, alt: `Exemplo do formato ${f.nome}` }
            : { imagem: `https://i.ytimg.com/vi/${id}/oardefault.jpg`, reserva: `https://i.ytimg.com/vi/${id}/hqdefault.jpg`, alt: `Exemplo do formato ${f.nome}` };
          return `<a class="formato-video" href="https://www.youtube.com/watch?v=${id}" data-video="${id}" data-titulo="${esc(f.nome)}" aria-label="Assistir ao exemplo: ${esc(f.nome)}">
            ${midia(capa)}<span class="play" aria-hidden="true">${icones.play}</span>${f.marca ? `<span class="formato-marca-sombra" aria-hidden="true"></span><span class="destaque-marca">${esc(f.marca)}</span>` : ""}</a>`;
        }
        if (f.video) {
          return `<a class="formato-video" href="${esc(f.video)}" target="_blank" rel="noopener" aria-label="Assistir ao exemplo: ${esc(f.nome)}. Abre em nova aba.">
            <span class="em-breve">${icones.play.replace("<svg", '<svg style="fill:currentColor"')}<span>Assistir exemplo</span></span></a>`;
        }
        return `<div class="formato-video"><span class="em-breve">${icone(f)}<span>Vídeo em breve</span></span></div>`;
      }

      let atual = 0;
      function mostrarFormato(i, animar) {
        atual = (i + total) % total;
        const f = fm.itens[atual];
        $("#formatoPainel").innerHTML = `
          <div class="formato-texto${animar ? " trocando" : ""}">
            <div class="formato-topo"><span class="formato-icone">${icone(f)}</span>
              <span class="formato-contagem">Formato ${atual + 1} de ${total}</span></div>
            <h3>${esc(f.nome)}</h3>
            <p>${esc(f.descricao)}</p>
            <dl>
              <div><dt>Onde encaixa</dt><dd>${esc(f.onde)}</dd></div>
              <div><dt>Ideal para</dt><dd>${esc(f.ideal)}</dd></div>
            </dl>
            <div class="formato-nav">
              <button type="button" class="anterior" aria-label="Formato anterior">‹ Anterior</button>
              <button type="button" class="proximo" aria-label="Próximo formato: ${esc(fm.itens[(atual + 1) % total].nome)}">Próximo ›</button>
            </div>
          </div>
          ${videoFormato(f).replace('class="formato-video"', `class="formato-video${animar ? " trocando" : ""}"`)}`;
        document.querySelectorAll(".formato-aba").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.formato) === atual)));
      }
      $("#formatosAbas").addEventListener("click", (e) => {
        const b = e.target.closest(".formato-aba");
        if (b) mostrarFormato(Number(b.dataset.formato), true);
      });
      $("#formatoPainel").addEventListener("click", (e) => {
        if (e.target.closest(".proximo")) { mostrarFormato(atual + 1, true); $("#formatoPainel .proximo").focus(); }
        else if (e.target.closest(".anterior")) { mostrarFormato(atual - 1, true); $("#formatoPainel .anterior").focus(); }
      });
      mostrarFormato(0, false);
    } else { $("#formatos").remove(); }

    /* ---------- 4. Trabalhos ---------- */
    // Card de um trabalho (usado no catálogo e no TikTok Shop)
    function cardTrabalho(t) {
      const id = idYoutube(t.video);
      const capa = id && !t.imagem ? { ...t, imagem: `https://i.ytimg.com/vi/${id}/oardefault.jpg`, reserva: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` } : t;
      const etiqueta = t.subcategoria || t.categoria || "";
      const atributos = id
        ? `href="https://www.youtube.com/watch?v=${id}" data-video="${id}" data-titulo="${esc(t.titulo)}" aria-label="Assistir vídeo: ${esc(t.titulo)}, ${esc(etiqueta)}, ${esc(t.formato)}. ${esc(t.descricao)}"`
        : `href="#contato" aria-label="${esc(t.titulo)}, ${esc(etiqueta)}, ${esc(t.formato)}. ${esc(t.descricao)}"`;
      return `
        <a class="trabalho${id ? " com-video" : ""}" ${atributos}>
          ${midia(capa)}
          ${id ? `<span class="play play-mini" aria-hidden="true">${icones.play}</span>` : ""}
          <span class="trabalho-tag" aria-hidden="true">${esc(etiqueta)}</span>
          <div class="trabalho-info" aria-hidden="true">
            <h4>${esc(t.titulo)}</h4>
            <p class="formato">${esc(t.formato)}</p>
            <p class="desc">${esc(t.descricao)}</p>
          </div>
        </a>`;
    }

    const tb = CONFIG.trabalhos;
    $("#trabalhosCabecalho").innerHTML = cabecalho(tb, "titulo-trabalhos");
    $("#filtros").innerHTML = ["Todos", ...tb.categorias]
      .map((cat, i) => `<button type="button" class="filtro" data-filtro="${esc(cat)}" aria-pressed="${i === 0}">${esc(cat)}</button>`).join("")
      + `<button type="button" class="filtro filtro-tts" data-filtro="${esc(CONFIG.tiktokShop.selo)}" aria-pressed="false">${icones.carrinho} ${esc(CONFIG.tiktokShop.selo)}</button>`;

    // Subnichos de cada nicho, na ordem em que aparecem na lista de trabalhos
    const subnichos = {};
    tb.categorias.forEach((cat) => {
      subnichos[cat] = [...new Set(tb.itens.filter((t) => t.categoria === cat && t.subcategoria).map((t) => t.subcategoria))];
    });

    // Uma fileira para cada subnicho (ou uma só para o nicho, se ele não tiver subnichos)
    const fileiras = [];
    tb.categorias.forEach((cat) => {
      const doNicho = tb.itens.filter((t) => t.categoria === cat);
      if (!doNicho.length) return;
      const semSub = doNicho.filter((t) => !t.subcategoria);
      subnichos[cat].forEach((sub) => fileiras.push({ cat, sub, itens: doNicho.filter((t) => t.subcategoria === sub) }));
      if (semSub.length) fileiras.push({ cat, sub: "", itens: semSub });
    });
    // Vídeos do TikTok Shop: fileira própria dentro de Trabalhos (aparece em "Todos" e no botão TikTok Shop)
    const tts = CONFIG.tiktokShop;
    if (tts.itens.length) fileiras.push({ cat: tts.selo, sub: "", itens: tts.itens.map((t) => ({ categoria: tts.selo, ...t })) });

    $("#catalogo").innerHTML = fileiras.map(({ cat, sub, itens }, idx) => {
      const idTrilho = `trilho-${idx}`;
      const nomeFileira = sub ? `${cat}: ${sub}` : cat;
      return `
        <div class="fileira revelar" data-categoria="${esc(cat)}" data-sub="${esc(sub)}">
          <div class="fileira-topo">
            <h3 class="fileira-titulo">${sub ? `<span class="fileira-nicho">${esc(cat)}</span>${esc(sub)}` : esc(cat)}<small>${itens.length} ${itens.length === 1 ? "trabalho" : "trabalhos"}</small></h3>
            <div class="setas">
              <button type="button" class="seta" data-trilho="${idTrilho}" data-dir="-1" aria-label="Ver trabalhos anteriores de ${esc(nomeFileira)}">${icones.esquerda}</button>
              <button type="button" class="seta" data-trilho="${idTrilho}" data-dir="1" aria-label="Ver mais trabalhos de ${esc(nomeFileira)}">${icones.direita}</button>
            </div>
          </div>
          <div class="trilho" id="${idTrilho}">
            ${itens.map(cardTrabalho).join("")}
          </div>
        </div>`;
    }).join("");

    // Filtros: primeiro o nicho; se ele tiver subnichos, aparece uma segunda linha de botões
    let nichoAtual = "Todos";
    function aplicarFiltro(nicho, sub) {
      nichoAtual = nicho;
      document.querySelectorAll("#filtros .filtro").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filtro === nicho)));
      document.querySelectorAll(".fileira").forEach((f) => {
        f.hidden = (nicho !== "Todos" && f.dataset.categoria !== nicho) || (sub && f.dataset.sub !== sub);
        f.classList.add("visivel");
      });
      $("#catalogo").classList.toggle("filtrado", nicho !== "Todos");

      const caixaSub = $("#subfiltros");
      const lista = nicho !== "Todos" ? subnichos[nicho] || [] : [];
      if (lista.length) {
        caixaSub.hidden = false;
        caixaSub.setAttribute("aria-label", `Filtrar ${nicho} por subnicho`);
        caixaSub.innerHTML = `<span class="subfiltros-rotulo">Subnicho:</span>` +
          [{ valor: "", texto: `Tudo de ${nicho}` }, ...lista.map((s) => ({ valor: s, texto: s }))]
            .map((o) => `<button type="button" class="filtro filtro-sub" data-sub="${esc(o.valor)}" aria-pressed="${o.valor === (sub || "")}">${esc(o.texto)}</button>`).join("");
      } else {
        caixaSub.hidden = true;
        caixaSub.innerHTML = "";
      }
    }
    $("#filtros").addEventListener("click", (e) => {
      const botao = e.target.closest("button.filtro");
      if (botao) aplicarFiltro(botao.dataset.filtro, "");
    });
    $("#subfiltros").addEventListener("click", (e) => {
      const botao = e.target.closest(".filtro-sub");
      if (botao) aplicarFiltro(nichoAtual, botao.dataset.sub);
    });
    // Link "TikTok Shop" do menu: rola até Trabalhos e já aplica o filtro
    document.querySelectorAll("#menu a[data-filtro]").forEach((a) => a.addEventListener("click", () => aplicarFiltro(a.dataset.filtro, "")));

    /* ---------- Player de vídeo (janela que abre por cima do site) ---------- */
    const janela = $("#janelaVideo");
    const molduraVideo = $("#molduraVideo");
    function abrirVideo(id, titulo) {
      $("#tituloVideo").textContent = titulo;
      // O YouTube só libera o player quando o site está num endereço da internet (ou localhost).
      // Aberto com dois cliques (file://), mostramos um aviso no lugar do erro do YouTube.
      if (location.protocol === "file:") {
        molduraVideo.innerHTML = `<p class="aviso-local">O vídeo vai tocar aqui quando o site estiver publicado (GitHub Pages, Vercel ou Netlify). Aberto direto do computador, o YouTube bloqueia o player.</p>`;
        janela.showModal();
        return;
      }
      const origem = encodeURIComponent(location.origin);
      molduraVideo.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1&modestbranding=1&origin=${origem}"
        title="${esc(titulo)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      if (typeof janela.showModal === "function") janela.showModal();
      else window.open(`https://www.youtube.com/watch?v=${id}`, "_blank", "noopener");
    }
    janela.addEventListener("close", () => { molduraVideo.innerHTML = ""; });
    $("#fecharVideo").addEventListener("click", () => janela.close());
    janela.addEventListener("click", (e) => { if (e.target === janela) janela.close(); });

    // Cliques nos cards com vídeo (em qualquer parte do site) e nas setas das fileiras
    document.addEventListener("click", (e) => {
      const cardVideo = e.target.closest("[data-video]");
      if (cardVideo) {
        e.preventDefault();
        abrirVideo(cardVideo.dataset.video, cardVideo.dataset.titulo);
        return;
      }
      const seta = e.target.closest(".seta");
      if (!seta) return;
      const trilho = document.getElementById(seta.dataset.trilho);
      trilho.scrollBy({ left: Number(seta.dataset.dir) * trilho.clientWidth * 0.85, behavior: "smooth" });
    });

    /* ---------- 6. Números e depoimentos ---------- */
    const nm = CONFIG.numeros;
    $("#numerosCabecalho").innerHTML = cabecalho(nm, "titulo-numeros");
    const formatar = (v, casas) => v.toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
    $("#contadores").innerHTML = nm.contadores.map((n, i) => `
      <li class="contador revelar" style="transition-delay:${i * 0.1}s">
        <strong data-valor="${n.valor}" data-casas="${n.casas}" data-prefixo="${esc(n.prefixo)}" data-sufixo="${esc(n.sufixo)}"
          aria-label="${esc(n.prefixo + formatar(n.valor, n.casas) + n.sufixo)}">${esc(n.prefixo)}0${esc(n.sufixo)}</strong>
        <span>${esc(n.rotulo)}</span>
      </li>`).join("");
    if (!nm.resultados.length) { $("#resultadosTitulo").style.display = "none"; $("#resultados").style.display = "none"; }
    $("#resultados").innerHTML = nm.resultados.map((r, i) => `
      <article class="resultado revelar" style="transition-delay:${i * 0.1}s">
        <span class="nicho">${esc(r.nicho)}</span>
        <strong>${esc(r.valor)}</strong>
        <span class="metrica">${esc(r.metrica)}</span>
        <p>${esc(r.texto)}</p>
      </article>`).join("");
    if (nm.compilado) {
      const cp = nm.compilado;
      $("#compilado").innerHTML = `
        <p class="compilado-resumo">${esc(cp.resumo)}</p>
        <ul class="compilado-pontos">
          ${cp.pontos.map((p) => `<li><b>${esc(p.rotulo)}</b><span>em ${p.vezes} avaliações</span></li>`).join("")}
        </ul>`;
    }
    const VISIVEIS = 6;
    $("#depoimentos").innerHTML = nm.depoimentos.map((d, i) => `
      <figure class="depoimento revelar${i >= VISIVEIS ? " depoimento-extra" : ""}" style="transition-delay:${(i % 3) * 0.1}s"${i >= VISIVEIS ? " hidden" : ""}>
        <span class="aspas" aria-hidden="true">&ldquo;</span>
        <span class="estrelas" role="img" aria-label="Avaliação 5 de 5 estrelas">★★★★★</span>
        <blockquote>${esc(d.texto)}</blockquote>
        <figcaption>
          <span class="avatar" aria-hidden="true">${esc(d.nome.split(" ").map((p) => p[0]).slice(0, 2).join(""))}</span>
          <div><b>${esc(d.nome)}</b>${d.empresa ? `<span>${esc(d.empresa)}</span>` : ""}</div>
        </figcaption>
      </figure>`).join("");
    if (nm.depoimentos.length > VISIVEIS) {
      const botao = $("#verTodas");
      const rotulo = (aberto) => aberto ? "Mostrar menos" : `Ver todas as ${nm.depoimentos.length} avaliações`;
      botao.textContent = rotulo(false);
      $("#verTodasCaixa").hidden = false;
      botao.addEventListener("click", () => {
        const abrir = botao.getAttribute("aria-expanded") !== "true";
        document.querySelectorAll(".depoimento-extra").forEach((el) => { el.hidden = !abrir; if (abrir) el.classList.add("visivel"); });
        botao.setAttribute("aria-expanded", String(abrir));
        botao.textContent = rotulo(abrir);
        if (!abrir) $("#depoimentos").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function animarContador(el) {
      const final = parseFloat(el.dataset.valor);
      const casas = parseInt(el.dataset.casas, 10);
      const { prefixo, sufixo } = el.dataset;
      const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduzir) { el.textContent = prefixo + formatar(final, casas) + sufixo; return; }
      const duracao = 1800;
      const inicio = performance.now();
      function passo(agora) {
        const p = Math.min((agora - inicio) / duracao, 1);
        const suave = 1 - Math.pow(1 - p, 3);
        el.textContent = prefixo + formatar(final * suave, casas) + sufixo;
        if (p < 1) requestAnimationFrame(passo);
      }
      requestAnimationFrame(passo);
    }

    /* ---------- 7. Contato ---------- */
    const ct = CONFIG.contatoSecao;
    $("#contatoDireto").innerHTML = `${cabecalho({ kicker: ct.kicker, titulo: ct.titulo }, "titulo-contato")}
      <p>${esc(ct.texto)}</p>
      <div class="botoes-contato">
        <a class="botao-contato" href="${linkWhats}" target="_blank" rel="noopener">
          <span class="icone">${icones.whatsapp}</span><div><b>WhatsApp</b><span>${esc(c.whatsapp)}</span></div>
        </a>
        <a class="botao-contato" href="mailto:${esc(c.email)}">
          <span class="icone">${icones.email}</span><div><b>E-mail</b><span>${esc(c.email)}</span></div>
        </a>
        <a class="botao-contato" href="${esc(c.instagram)}" target="_blank" rel="noopener">
          <span class="icone">${icones.instagram}</span><div><b>Instagram</b><span>${esc(c.usuario)}</span></div>
        </a>
      </div>`;

    $("#formContato").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const aviso = $("#avisoForm");
      const invalido = [...form.elements].find((el) => el.willValidate && !el.checkValidity());
      if (invalido) {
        aviso.style.cssText = "background:#fbeaff;border-color:#a23bbf;color:#6e1c80";
        aviso.textContent = invalido.type === "email" && invalido.value
          ? "Confira o e-mail digitado, parece que falta alguma coisa."
          : "Preencha nome, e-mail e mensagem para eu poder te responder.";
        aviso.classList.add("mostrar");
        invalido.focus();
        return;
      }
      const nome = form.nome.value.trim();
      const assunto = `Proposta de parceria UGC: ${nome}`;
      const corpo = `Olá, Prissila!\n\n${form.mensagem.value.trim()}\n\nNome: ${nome}\nE-mail: ${form.email.value.trim()}`;
      window.location.href = `mailto:${c.email}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
      aviso.style.cssText = "";
      aviso.textContent = ct.mensagemSucesso;
      aviso.classList.add("mostrar");
      form.reset();
    });

    /* Botões redondos das redes na barra de cima */
    $("#redesTopo").innerHTML = `
      <li><a href="${esc(c.instagram)}" target="_blank" rel="noopener" aria-label="Instagram ${esc(c.usuario)}" title="Instagram">${icones.instagram}</a></li>
      <li><a href="${esc(c.tiktok)}" target="_blank" rel="noopener" aria-label="TikTok ${esc(c.usuario)}" title="TikTok">${icones.tiktok}</a></li>
      <li><a href="${linkWhats}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(c.whatsapp)}" title="WhatsApp">${icones.whatsapp}</a></li>`;

    /* ---------- 8. Rodapé ---------- */
    $("#logoRodape").textContent = CONFIG.perfil.nome;
    $("#logoRodape").setAttribute("aria-label", `${CONFIG.perfil.nome}, voltar ao início`);
    $("#redesRodape").innerHTML = `
      <li><a href="${esc(c.instagram)}" target="_blank" rel="noopener">${icones.instagram} Instagram</a></li>
      <li><a href="${esc(c.tiktok)}" target="_blank" rel="noopener">${icones.tiktok} TikTok</a></li>
      <li><a href="${linkWhats}" target="_blank" rel="noopener">${icones.whatsapp} WhatsApp</a></li>
      <li><a href="mailto:${esc(c.email)}">${icones.email} E-mail</a></li>`;
    $("#direitos").textContent = `© ${new Date().getFullYear()} ${CONFIG.perfil.nome} · ${CONFIG.perfil.profissao}. ${CONFIG.rodape.frase}`;

    /* ---------- Menu: fundo ao rolar, sanduíche e link ativo ---------- */
    const topo = $("#topo");
    const btnMenu = $("#btnMenu");
    const menu = $("#menu");
    const aoRolar = () => topo.classList.toggle("rolado", window.scrollY > 40);
    window.addEventListener("scroll", aoRolar, { passive: true });
    aoRolar();

    function fecharMenu() {
      menu.classList.remove("aberto");
      btnMenu.setAttribute("aria-expanded", "false");
      btnMenu.setAttribute("aria-label", "Abrir menu");
    }
    btnMenu.addEventListener("click", () => {
      const abrir = btnMenu.getAttribute("aria-expanded") !== "true";
      menu.classList.toggle("aberto", abrir);
      btnMenu.setAttribute("aria-expanded", String(abrir));
      btnMenu.setAttribute("aria-label", abrir ? "Fechar menu" : "Abrir menu");
      if (abrir) menu.querySelector("a").focus();
    });
    menu.addEventListener("click", (e) => { if (e.target.closest("a")) fecharMenu(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && menu.classList.contains("aberto")) { fecharMenu(); btnMenu.focus(); }
    });
    window.addEventListener("resize", () => { if (window.innerWidth > 1120) fecharMenu(); });

    const linksMenu = [...menu.querySelectorAll("a")];
    const observadorSecoes = new IntersectionObserver((entradas) => {
      entradas.forEach((en) => {
        if (en.isIntersecting) {
          linksMenu.forEach((l) => {
            const ativo = l.getAttribute("href") === `#${en.target.id}`;
            l.classList.toggle("ativo", ativo);
            if (ativo) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current");
          });
        }
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    document.querySelectorAll("main section[id]").forEach((s) => observadorSecoes.observe(s));

    /* ---------- Animações de entrada ao rolar ---------- */
    const observadorRevelar = new IntersectionObserver((entradas, obs) => {
      entradas.forEach((en) => {
        if (!en.isIntersecting) return;
        en.target.classList.add("visivel");
        en.target.querySelectorAll?.("[data-valor]").forEach(animarContador);
        obs.unobserve(en.target);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".revelar").forEach((el) => observadorRevelar.observe(el));


  </script>
</body>
</html>
