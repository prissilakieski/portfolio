<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prissila Kieski | Criadora de Conteúdo UGC</title>
  <meta name="description" content="Prissila Kieski, criadora de conteúdo UGC. Vídeos autênticos que vendem para marcas de beleza, casa, comida, moda e fitness.">
  <meta name="theme-color" content="#0b0b0b">

  <!-- Fontes do Google: Anton (títulos) e Archivo (corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       CORES E MEDIDAS DO SITE (troque aqui para mudar o visual)
       ========================================================== */
    :root {
      --preto: #0b0b0b;
      --vermelho: #e50914;
      --vermelho-texto: #ff3b44;   /* vermelho um pouco mais claro para textos pequenos (melhor contraste) */
      --vermelho-escuro: #8a050c;
      --card: #1c1c1c;
      --card-2: #252525;
      --texto: #f5f5f5;
      --texto-suave: #b8b8b8;
      --borda: rgba(255, 255, 255, 0.08);
      --titulo: "Anton", "Impact", "Arial Narrow", sans-serif;
      --corpo: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
      --largura: 1200px;
      --gutter: clamp(16px, 4vw, 40px);
      --raio: 6px;
      --header-h: 68px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: clip; }
    body {
      margin: 0;
      background: var(--preto);
      color: var(--texto);
      font-family: var(--corpo);
      font-size: 1rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 400; }
    p { margin: 0; }
    ul { margin: 0; padding: 0; list-style: none; }
    button, input, textarea { font: inherit; color: inherit; }

    :focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
      border-radius: 4px;
    }

    .pular {
      position: absolute; left: 16px; top: -100px; z-index: 200;
      background: var(--vermelho); color: #fff; padding: 10px 16px;
      border-radius: var(--raio); font-weight: 700; text-decoration: none;
    }
    .pular:focus { top: 12px; }

    .container {
      width: 100%;
      max-width: var(--largura);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    section { scroll-margin-top: var(--header-h); }
    .secao { padding-block: clamp(64px, 10vw, 120px); position: relative; }

    .kicker {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--vermelho-texto);
      font-weight: 800; font-size: 0.8rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 14px;
    }
    .kicker::before {
      content: ""; width: 26px; height: 3px; background: var(--vermelho); border-radius: 2px;
    }
    .titulo-secao {
      font-family: var(--titulo);
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 1.02;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }
    .sub-secao {
      color: var(--texto-suave);
      max-width: 620px;
      margin-top: 14px;
      font-size: 1.05rem;
    }
    .cabecalho-secao { margin-bottom: clamp(32px, 5vw, 56px); }

    /* ---------- Botões ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 50px; padding: 12px 26px;
      border-radius: var(--raio); border: 0;
      font-weight: 700; font-size: 1rem; text-decoration: none;
      cursor: pointer; transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease;
    }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn-vermelho { background: var(--vermelho); color: #fff; }
    .btn-vermelho:hover { background: #f6121e; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(229, 9, 20, .35); }
    .btn-cinza { background: rgba(109, 109, 110, 0.7); color: #fff; }
    .btn-cinza:hover { background: rgba(109, 109, 110, 0.95); transform: translateY(-2px); }

    /* ---------- Blocos de imagem em gradiente ---------- */
    .midia {
      position: relative; overflow: hidden; width: 100%; height: 100%;
      background-color: var(--card);
      background-size: cover; background-position: center;
    }
    .midia::after {
      /* leve granulado e vinheta para dar clima de cinema */
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
    }
    img.midia { object-fit: cover; }

    /* ==========================================================
       1. CAPA
       ========================================================== */
    .topo {
      position: fixed; inset: 0 0 auto 0; z-index: 100;
      height: var(--header-h);
      background: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,0));
      transition: background-color .3s ease, box-shadow .3s ease;
    }
    .topo.rolado { background-color: rgba(11, 11, 11, .97); box-shadow: 0 1px 0 var(--borda); }
    .topo .container {
      height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo {
      font-family: var(--titulo); font-size: 1.7rem; letter-spacing: 0.04em;
      color: var(--vermelho); text-decoration: none; text-transform: uppercase; line-height: 1;
      white-space: nowrap;
    }
    .menu { display: flex; gap: 6px; }
    .menu a {
      display: block; padding: 8px 12px; border-radius: 4px;
      text-decoration: none; font-weight: 600; font-size: .95rem; color: #e5e5e5;
      transition: color .2s ease;
    }
    .menu a:hover, .menu a.ativo { color: #fff; }
    .menu a.ativo { box-shadow: inset 0 -2px 0 var(--vermelho); }
    .btn-menu {
      display: none; width: 46px; height: 46px; border: 0; background: transparent;
      cursor: pointer; border-radius: 6px; position: relative;
    }
    .btn-menu span, .btn-menu span::before, .btn-menu span::after {
      position: absolute; left: 11px; width: 24px; height: 2px; background: #fff; border-radius: 2px;
      transition: transform .25s ease, background-color .25s ease;
    }
    .btn-menu span { top: 22px; }
    .btn-menu span::before { content: ""; left: 0; top: -8px; }
    .btn-menu span::after { content: ""; left: 0; top: 8px; }
    .btn-menu[aria-expanded="true"] span { background: transparent; }
    .btn-menu[aria-expanded="true"] span::before { transform: translateY(8px) rotate(45deg); }
    .btn-menu[aria-expanded="true"] span::after { transform: translateY(-8px) rotate(-45deg); }

    .capa {
      position: relative; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding-top: calc(var(--header-h) + 32px);
      background:
        radial-gradient(ellipse 70% 60% at 80% 35%, rgba(229, 9, 20, .28), transparent 70%),
        radial-gradient(ellipse 60% 50% at 0% 100%, rgba(229, 9, 20, .12), transparent 70%),
        var(--preto);
      overflow: hidden;
    }
    .capa-grade {
      display: grid; grid-template-columns: 1.25fr 0.75fr; gap: clamp(28px, 5vw, 64px);
      align-items: center; padding-bottom: clamp(36px, 6vw, 64px);
    }
    .selo {
      display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px;
      font-weight: 700; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: #e5e5e5;
    }
    .selo b {
      font-family: var(--titulo); font-weight: 400; color: #fff; background: var(--vermelho);
      padding: 3px 8px 2px; border-radius: 3px; letter-spacing: .06em; font-size: 1rem;
    }
    .capa h1 {
      font-family: var(--titulo); text-transform: uppercase;
      font-size: clamp(3.4rem, 10.5vw, 8.6rem); line-height: .92; letter-spacing: .01em;
      text-shadow: 0 6px 40px rgba(0,0,0,.6);
    }
    .capa h1 .linha-2 { color: var(--vermelho); display: block; }
    .capa .frase {
      margin-top: 22px; max-width: 560px;
      font-size: clamp(1.05rem, 2.2vw, 1.3rem); color: #e8e8e8; line-height: 1.55;
    }
    .capa .frase strong { color: #fff; }
    .capa-botoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .capa-numeros {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
      margin-top: 40px; max-width: 560px;
    }
    .capa-numeros li { border-left: 3px solid var(--vermelho); padding-left: 14px; }
    .capa-numeros strong {
      display: block; font-family: var(--titulo); font-weight: 400;
      font-size: clamp(1.7rem, 4vw, 2.5rem); line-height: 1.05;
    }
    .capa-numeros span { font-size: .88rem; color: var(--texto-suave); }

    .capa-foto {
      position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--borda);
      max-width: 420px; justify-self: end; width: 100%;
    }
    /* Enquadramento da foto da capa: o segundo número sobe ou desce o corte (0% = topo, 100% = base) */
    .capa-foto img.midia { object-position: 52% 40%; }
    .capa-foto::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(0deg, rgba(11,11,11,.55) 0%, transparent 35%);
    }
    .capa-foto .iniciais {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 1;
      font-family: var(--titulo); font-size: clamp(6rem, 16vw, 11rem); color: rgba(255,255,255,.1);
      pointer-events: none; letter-spacing: .02em;
    }
    .capa-foto .etiqueta {
      position: absolute; left: 14px; bottom: 14px; z-index: 2;
      background: rgba(11,11,11,.8); backdrop-filter: blur(6px);
      padding: 8px 12px; border-radius: 4px; font-size: .82rem; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .ponto-ao-vivo {
      width: 8px; height: 8px; border-radius: 50%; background: var(--vermelho);
      box-shadow: 0 0 0 0 rgba(229,9,20,.7); animation: pulso 2s infinite;
    }
    @keyframes pulso {
      0% { box-shadow: 0 0 0 0 rgba(229,9,20,.7); }
      70% { box-shadow: 0 0 0 10px rgba(229,9,20,0); }
      100% { box-shadow: 0 0 0 0 rgba(229,9,20,0); }
    }

    .faixa-marcas {
      border-top: 1px solid var(--borda); border-bottom: 1px solid var(--borda);
      background: rgba(0,0,0,.5); overflow: hidden; position: relative;
    }
    .faixa-marcas .rotulo {
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; padding: 0 18px 0 var(--gutter);
      background: linear-gradient(90deg, var(--preto) 75%, transparent);
      font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--texto-suave);
    }
    .faixa-trilho { display: flex; width: max-content; animation: deslizar 38s linear infinite; }
    .faixa-marcas:hover .faixa-trilho { animation-play-state: paused; }
    .faixa-trilho ul { display: flex; }
    .faixa-trilho li {
      padding: 18px 28px; white-space: nowrap;
      font-family: var(--titulo); font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase;
      color: #9a9a9a; display: flex; align-items: center; gap: 28px;
    }
    .faixa-trilho li::after { content: ""; width: 6px; height: 6px; background: var(--vermelho); border-radius: 50%; }
    @keyframes deslizar { to { transform: translateX(-50%); } }

    /* ==========================================================
       2. SOBRE MIM
       ========================================================== */
    .sobre-grade {
      display: grid; grid-template-columns: 0.85fr 1.15fr; gap: clamp(32px, 6vw, 80px); align-items: center;
    }
    .sobre-foto {
      aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; position: relative;
      box-shadow: 0 0 0 1px var(--borda), 0 24px 60px rgba(0,0,0,.5);
    }
    .sobre-texto p { color: #dcdcdc; font-size: 1.08rem; margin-top: 16px; }
    .sobre-texto p:first-of-type { margin-top: 22px; }
    .entregas {
      margin-top: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    }
    .entregas li {
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio);
      padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-weight: 600; font-size: .95rem;
    }
    .entregas svg { width: 20px; height: 20px; color: var(--vermelho-texto); flex-shrink: 0; margin-top: 2px; }

    /* ==========================================================
       3. CONTEÚDOS DE DESTAQUE
       ========================================================== */
    .destaques-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 3vw, 32px); }
    .destaque {
      display: block; text-decoration: none; color: inherit; border-radius: 10px;
      background: var(--card); overflow: hidden; position: relative;
      box-shadow: 0 0 0 1px var(--borda);
      transition: transform .35s ease, box-shadow .35s ease;
    }
    .destaque:hover, .destaque:focus-visible {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 0 0 2px var(--vermelho), 0 30px 60px rgba(0,0,0,.6);
    }
    .destaque-capa { aspect-ratio: 9 / 16; position: relative; overflow: hidden; }
    .destaque-capa .midia { transition: transform .6s ease; }
    .destaque:hover .destaque-capa .midia { transform: scale(1.06); }
    .ranking {
      position: absolute; top: 10px; left: 14px; z-index: 2;
      font-family: var(--titulo); font-size: 4.5rem; line-height: 1; color: transparent;
      -webkit-text-stroke: 2px rgba(255,255,255,.85);
    }
    .tag-alta {
      position: absolute; top: 14px; right: 14px; z-index: 2;
      background: var(--vermelho); color: #fff; font-size: .72rem; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 3px;
    }
    .play {
      position: absolute; left: 50%; top: 50%; z-index: 2;
      width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%;
      background: rgba(11,11,11,.55); border: 2px solid rgba(255,255,255,.9);
      display: grid; place-items: center; backdrop-filter: blur(4px);
      transition: background-color .3s ease, transform .3s ease, border-color .3s ease;
    }
    .play svg { width: 28px; height: 28px; margin-left: 4px; fill: #fff; }
    .destaque:hover .play, .destaque:focus-visible .play { background: var(--vermelho); border-color: var(--vermelho); transform: scale(1.1); }
    .destaque-info { padding: 20px 20px 24px; }
    .destaque-numero {
      font-family: var(--titulo); font-size: clamp(2.4rem, 4.4vw, 3.2rem); line-height: 1; color: #fff;
    }
    .destaque-rotulo {
      display: block; margin-top: 6px; color: var(--vermelho-texto);
      font-weight: 800; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase;
    }
    .destaque-titulo { margin-top: 14px; font-family: var(--corpo); font-weight: 800; font-size: 1.15rem; line-height: 1.3; }
    .destaque-contexto { margin-top: 6px; color: var(--texto-suave); font-size: .95rem; }

    /* ==========================================================
       4. TRABALHOS POR NICHO (catálogo)
       ========================================================== */
    .filtros { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px; }
    .filtro {
      border: 1px solid rgba(255,255,255,.25); background: transparent; color: #e5e5e5;
      padding: 9px 18px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .92rem;
      transition: background-color .2s ease, border-color .2s ease, color .2s ease;
    }
    .filtro:hover { border-color: #fff; color: #fff; }
    .filtro[aria-pressed="true"] { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }

    .fileira { margin-bottom: 26px; }
    .fileira[hidden] { display: none; }
    .fileira-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .fileira-titulo { font-family: var(--corpo); font-weight: 800; font-size: 1.3rem; }
    .fileira-titulo small { color: var(--texto-suave); font-weight: 500; font-size: .9rem; margin-left: 8px; }
    .setas { display: flex; gap: 8px; }
    .seta {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
      background: rgba(28,28,28,.9); cursor: pointer; display: grid; place-items: center;
      transition: background-color .2s ease, border-color .2s ease;
    }
    .seta:hover { background: var(--vermelho); border-color: var(--vermelho); }
    .seta svg { width: 18px; height: 18px; }
    .trilho {
      display: grid; grid-auto-flow: column; grid-auto-columns: clamp(150px, 21vw, 232px);
      gap: 14px; overflow-x: auto; overscroll-behavior-x: contain;
      padding: 18px 4px 22px; margin-inline: -4px;
      scroll-snap-type: x mandatory; scroll-padding-inline: 4px;
      scrollbar-width: thin; scrollbar-color: #3a3a3a transparent;
    }
    .trilho::-webkit-scrollbar { height: 6px; }
    .trilho::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
    .catalogo.filtrado .trilho {
      grid-auto-flow: row; grid-auto-columns: auto;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr));
      overflow: visible;
    }
    .catalogo.filtrado .setas { display: none; }

    .trabalho {
      scroll-snap-align: start; position: relative; display: block;
      aspect-ratio: 2 / 3; border-radius: var(--raio); overflow: hidden;
      text-decoration: none; color: inherit; background: var(--card);
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .trabalho:hover, .trabalho:focus-visible {
      transform: scale(1.06); z-index: 3;
      box-shadow: 0 0 0 2px var(--vermelho), 0 20px 40px rgba(0,0,0,.7);
    }
    .trabalho .midia { position: absolute; inset: 0; }
    .trabalho-tag {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      font-family: var(--titulo); font-size: .95rem; color: var(--vermelho);
      background: rgba(11,11,11,.85); padding: 3px 8px 1px; border-radius: 3px; letter-spacing: .05em;
    }
    .trabalho-info {
      position: absolute; inset: auto 0 0 0; z-index: 2; padding: 40px 12px 12px;
      background: linear-gradient(0deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.7) 55%, transparent 100%);
    }
    .trabalho-info h4 { margin: 0; font-size: 1rem; font-weight: 800; line-height: 1.25; }
    .trabalho-info .formato { font-size: .78rem; color: var(--texto-suave); font-weight: 600; margin-top: 4px; }
    .trabalho-info .desc {
      font-size: .82rem; color: #ddd; line-height: 1.4;
      max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s ease, opacity .35s ease, margin .35s ease;
    }
    .trabalho:hover .desc, .trabalho:focus-visible .desc { max-height: 90px; opacity: 1; margin-top: 8px; }

    /* Cards de trabalho com vídeo e janela do player */
    .play-mini { width: 54px; height: 54px; margin: -27px 0 0 -27px; }
    .play-mini svg { width: 22px; height: 22px; }
    .trabalho:hover .play-mini, .trabalho:focus-visible .play-mini { background: var(--vermelho); border-color: var(--vermelho); transform: scale(1.1); }
    .trabalho img.midia { object-position: 50% 30%; }

    .janela-video {
      width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
      padding: 14px; border: 1px solid var(--borda); border-radius: 12px;
      background: var(--card); color: var(--texto); overflow: auto;
    }
    .janela-video::backdrop { background: rgba(0, 0, 0, .85); }
    .janela-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .janela-topo h2 { font-family: var(--titulo); font-size: 1.4rem; text-transform: uppercase; letter-spacing: .02em; }
    .fechar-video {
      width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--card-2); color: #fff; font-size: 1.8rem; line-height: 1;
    }
    .fechar-video:hover { background: var(--vermelho); }
    .moldura-video {
      aspect-ratio: 9 / 16; max-height: calc(100vh - 150px); margin-inline: auto;
      border-radius: 8px; overflow: hidden; background: #000;
    }
    .moldura-video iframe { width: 100%; height: 100%; border: 0; display: block; }
    .aviso-local { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--texto-suave); }

    /* ==========================================================
       5. SERVIÇOS
       ========================================================== */
    .servicos-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .servico {
      background: linear-gradient(180deg, var(--card-2), var(--card));
      border: 1px solid var(--borda); border-radius: 10px; padding: 28px 24px;
      position: relative; overflow: hidden;
      transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .servico::before {
      content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 3px;
      background: var(--vermelho); transform: scaleX(0); transform-origin: left; transition: transform .4s ease;
    }
    .servico:hover { transform: translateY(-4px); border-color: rgba(229,9,20,.5); box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    .servico:hover::before { transform: scaleX(1); }
    .servico-num {

    .servico p { color: var(--texto-suave); margin-top: 8px; }
    .servico .inclui { margin-top: 14px; font-size: .85rem; font-weight: 700; color: #e5e5e5; }

       6. NÚMEROS E DEPOIMENTOS
       ========================================================== */
    .numeros-secao { background: linear-gradient(180deg, var(--preto), #120405 50%, var(--preto)); }
    .contadores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .contador {
      text-align: center; padding: 30px 16px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--borda);
    }
    .contador strong {
      display: block; font-family: var(--titulo); font-weight: 400; color: #fff;
      font-size: clamp(2.6rem, 5.5vw, 4rem); line-height: 1;
    }
    .contador span { display: block; margin-top: 10px; color: var(--texto-suave); font-weight: 600; font-size: .95rem; }
    .subtitulo-bloco {
      font-family: var(--corpo); font-weight: 800; font-size: 1.3rem; margin: 56px 0 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .subtitulo-bloco::after { content: ""; flex: 1; height: 1px; background: var(--borda); }
    .resultados { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .resultado {
      border-radius: 10px; padding: 24px; background: var(--card); border: 1px solid var(--borda);
      border-left: 4px solid var(--vermelho);
    }
    .resultado .nicho { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--vermelho-texto); }

    .resultado .metrica { font-weight: 700; }
    .resultado p { color: var(--texto-suave); margin-top: 8px; font-size: .95rem; }
    .depoimentos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .depoimento {
      margin: 0; background: var(--card); border: 1px solid var(--borda); border-radius: 10px;
      padding: 28px 24px; display: flex; flex-direction: column; gap: 18px;
    }
    .depoimento .aspas { font-family: var(--titulo); font-size: 4rem; line-height: .6; color: var(--vermelho); height: 26px; }
    .estrelas { color: #ffc531; letter-spacing: 2px; font-size: 1rem; }
    .depoimento blockquote { margin: 0; color: #e2e2e2; font-size: 1.02rem; }
    .depoimento figcaption { margin-top: auto; display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      font-family: var(--titulo); font-size: 1.1rem; color: #fff;
      background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
    }
    .depoimento figcaption b { display: block; }
    .depoimento figcaption span { color: var(--texto-suave); font-size: .88rem; }

    /* ==========================================================
       7. CONTATO
       ========================================================== */
    .contato-caixa {
      border-radius: 14px; overflow: hidden; position: relative;
      background:
        radial-gradient(ellipse 60% 80% at 100% 0%, rgba(229,9,20,.35), transparent 60%),

      display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 64px);

    .form { display: grid; gap: 16px; }
    .campo label { display: block; font-weight: 700; font-size: .92rem; margin-bottom: 6px; }
    .campo input, .campo textarea {
      width: 100%; background: #0f0f0f; border: 1px solid #3a3a3a; border-radius: var(--raio);

    .form .btn { justify-self: start; }
    .aviso-form {
      display: none; background: rgba(46, 160, 67, .15); border: 1px solid rgba(46,160,67,.6);

    .contato-direto p { color: #dcdcdc; margin-top: 14px; }
    .botoes-contato { display: grid; gap: 12px; margin-top: 26px; }
    .botao-contato {
      display: flex; align-items: center; gap: 14px; text-decoration: none;
      background: rgba(11,11,11,.7); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px;
      transition: border-color .2s ease, transform .2s ease, background-color .2s ease;

      display: grid; place-items: center; flex-shrink: 0;
    }
    .botao-contato .icone svg { width: 22px; height: 22px; fill: #fff; }
    .botao-contato b { display: block; }
    .botao-contato span { color: var(--texto-suave); font-size: .92rem; overflow-wrap: anywhere; }
    .botao-contato > div { min-width: 0; }

    /* ==========================================================
       8. RODAPÉ
       ========================================================== */
    .rodape { border-top: 1px solid var(--borda); padding-block: 44px; background: #070707; }
    .rodape .container { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; }
    .rodape .logo { font-size: 1.5rem; }
    .redes { display: flex; flex-wrap: wrap; gap: 10px; }
    .redes a {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      padding: 8px 14px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; font-weight: 600; font-size: .9rem;
      transition: border-color .2s ease, background-color .2s ease;
    }
    .redes a:hover { border-color: var(--vermelho); background: rgba(229,9,20,.12); }
    .redes svg { width: 16px; height: 16px; fill: currentColor; }
    .direitos { width: 100%; color: #9a9a9a; font-size: .88rem; }

    /* ---------- Animação de entrada ---------- */
    .revelar { opacity: 0; transform: translateY(26px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
    .revelar.visivel { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      .revelar { opacity: 1; transform: none; }
    }

    /* ==========================================================
       RESPONSIVO
       ========================================================== */
    @media (max-width: 980px) {
      .btn-menu { display: block; }
      .menu {
        position: fixed; top: var(--header-h); left: 0; right: 0;
        flex-direction: column; gap: 0; padding: 8px var(--gutter) 20px;
        background: rgba(11,11,11,.98); border-bottom: 1px solid var(--borda);
        transform: translateY(-8px); opacity: 0; visibility: hidden;
        transition: opacity .25s ease, transform .25s ease, visibility .25s;
      }
      .menu.aberto { opacity: 1; transform: none; visibility: visible; }
      .menu a { padding: 14px 4px; font-size: 1.1rem; border-bottom: 1px solid var(--borda); border-radius: 0; }
      .menu a.ativo { box-shadow: none; color: var(--vermelho-texto); }

      .servicos-grade, .resultados, .depoimentos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .contadores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .contato-caixa { grid-template-columns: 1fr; }
    }

    @media (max-width: 820px) {
      .capa-grade { grid-template-columns: 1fr; }

      .sobre-foto { aspect-ratio: 4 / 3; }
      .destaques-grade { grid-template-columns: 1fr; max-width: 380px; margin-inline: auto; }
    }

    @media (max-width: 600px) {
      .capa { justify-content: flex-start; }

      .contadores { gap: 12px; }
      .contador { padding: 22px 10px; }
      .setas { display: none; }
      .form .btn { justify-self: stretch; }
      .faixa-marcas .rotulo { display: none; }

</head>

    $("#contadores").innerHTML = nm.contadores.map((n, i) => `
      <li class="contador revelar" style="transition-delay:${i * 0.1}s">
        <strong data-valor="${n.valor}" data-casas="${n.casas}" data-prefixo="${esc(n.prefixo)}" data-sufixo="${esc(n.sufixo)}"
          aria-label="${esc(n.prefixo + formatar(n.valor, n.casas) + n.sufixo)}">${esc(n.prefixo)}0${esc(n.sufixo)}</strong>
        <span>${esc(n.rotulo)}</span>
      </li>`).join("");
    $("#resultados").innerHTML = nm.resultados.map((r, i) => `
      <article class="resultado revelar" style="transition-delay:${i * 0.1}s">
        <span class="nicho">${esc(r.nicho)}</span>
        <strong>${esc(r.valor)}</strong>
        <span class="metrica">${esc(r.metrica)}</span>
        <p>${esc(r.texto)}</p>
      </article>`).join("");
    $("#depoimentos").innerHTML = nm.depoimentos.map((d, i) => `
      <figure class="depoimento revelar" style="transition-delay:${i * 0.1}s">
        <span class="aspas" aria-hidden="true">&ldquo;</span>
        <span class="estrelas" role="img" aria-label="Avaliação 5 de 5 estrelas">★★★★★</span>
        <blockquote>${esc(d.texto)}</blockquote>
        <figcaption>
          <span class="avatar" aria-hidden="true">${esc(d.nome.split(" ").map((p) => p[0]).slice(0, 2).join(""))}</span>
          <div><b>${esc(d.nome)}</b><span>${esc(d.empresa)}</span></div>
        </figcaption>
      </figure>`).join("");

    function animarContador(el) {
      const final = parseFloat(el.dataset.valor);
      const casas = parseInt(el.dataset.casas, 10);
      const { prefixo, sufixo } = el.dataset;
      const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduzir) { el.textContent = prefixo + formatar(final, casas) + sufixo; return; }
      const duracao = 1800;
      const inicio = performance.now();
      function passo(agora) {
        const p = Math.min((agora - inicio) / duracao, 1);
        const suave = 1 - Math.pow(1 - p, 3);
        el.textContent = prefixo + formatar(final * suave, casas) + sufixo;
        if (p < 1) requestAnimationFrame(passo);
      }
      requestAnimationFrame(passo);
    }

    /* ---------- 7. Contato ---------- */
    const ct = CONFIG.contatoSecao;
    $("#contatoDireto").innerHTML = `${cabecalho({ kicker: ct.kicker, titulo: ct.titulo }, "titulo-contato")}
      <p>${esc(ct.texto)}</p>
      <div class="botoes-contato">
        <a class="botao-contato" href="${linkWhats}" target="_blank" rel="noopener">
          <span class="icone">${icones.whatsapp}</span><div><b>WhatsApp</b><span>${esc(c.whatsapp)}</span></div>
        </a>
        <a class="botao-contato" href="mailto:${esc(c.email)}">
          <span class="icone">${icones.email}</span><div><b>E-mail</b><span>${esc(c.email)}</span></div>
        </a>
        <a class="botao-contato" href="${esc(c.instagram)}" target="_blank" rel="noopener">
          <span class="icone">${icones.instagram}</span><div><b>Instagram</b><span>${esc(c.usuario)}</span></div>
        </a>
      </div>`;

    $("#formContato").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const aviso = $("#avisoForm");
      const invalido = [...form.elements].find((el) => el.willValidate && !el.checkValidity());
      if (invalido) {
        aviso.style.cssText = "background:rgba(229,9,20,.15);border-color:rgba(229,9,20,.7);color:#ffd9db";
        aviso.textContent = invalido.type === "email" && invalido.value
          ? "Confira o e-mail digitado, parece que falta alguma coisa."
          : "Preencha nome, e-mail e mensagem para eu poder te responder.";
        aviso.classList.add("mostrar");
        invalido.focus();
        return;
      }
      const nome = form.nome.value.trim();
      const assunto = `Proposta de parceria UGC: ${nome}`;
      const corpo = `Olá, Prissila!\n\n${form.mensagem.value.trim()}\n\nNome: ${nome}\nE-mail: ${form.email.value.trim()}`;
      window.location.href = `mailto:${c.email}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
      aviso.style.cssText = "";
      aviso.textContent = ct.mensagemSucesso;
      aviso.classList.add("mostrar");
      form.reset();
    });

    /* ---------- 8. Rodapé ---------- */
    $("#logoRodape").textContent = CONFIG.perfil.nome;
    $("#logoRodape").setAttribute("aria-label", `${CONFIG.perfil.nome}, voltar ao início`);
    $("#redesRodape").innerHTML = `
      <li><a href="${esc(c.instagram)}" target="_blank" rel="noopener">${icones.instagram} Instagram</a></li>
      <li><a href="${esc(c.tiktok)}" target="_blank" rel="noopener">${icones.tiktok} TikTok</a></li>
      <li><a href="${linkWhats}" target="_blank" rel="noopener">${icones.whatsapp} WhatsApp</a></li>
      <li><a href="mailto:${esc(c.email)}">${icones.email} E-mail</a></li>`;
    $("#direitos").textContent = `© ${new Date().getFullYear()} ${CONFIG.perfil.nome} · ${CONFIG.perfil.profissao}. ${CONFIG.rodape.frase}`;

    /* ---------- Menu: fundo ao rolar, sanduíche e link ativo ---------- */
    const topo = $("#topo");
    const btnMenu = $("#btnMenu");
    const menu = $("#menu");
    const aoRolar = () => topo.classList.toggle("rolado", window.scrollY > 40);
    window.addEventListener("scroll", aoRolar, { passive: true });
    aoRolar();

    function fecharMenu() {
      menu.classList.remove("aberto");
      btnMenu.setAttribute("aria-expanded", "false");
      btnMenu.setAttribute("aria-label", "Abrir menu");
    }
    btnMenu.addEventListener("click", () => {
      const abrir = btnMenu.getAttribute("aria-expanded") !== "true";
      menu.classList.toggle("aberto", abrir);
      btnMenu.setAttribute("aria-expanded", String(abrir));
      btnMenu.setAttribute("aria-label", abrir ? "Fechar menu" : "Abrir menu");
      if (abrir) menu.querySelector("a").focus();
    });
    menu.addEventListener("click", (e) => { if (e.target.closest("a")) fecharMenu(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && menu.classList.contains("aberto")) { fecharMenu(); btnMenu.focus(); }
    });
    window.addEventListener("resize", () => { if (window.innerWidth > 980) fecharMenu(); });

    const linksMenu = [...menu.querySelectorAll("a")];
    const observadorSecoes = new IntersectionObserver((entradas) => {
      entradas.forEach((en) => {
        if (en.isIntersecting) {
          linksMenu.forEach((l) => {
            const ativo = l.getAttribute("href") === `#${en.target.id}`;
            l.classList.toggle("ativo", ativo);
            if (ativo) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current");
          });
        }
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    document.querySelectorAll("main section[id]").forEach((s) => observadorSecoes.observe(s));

    /* ---------- Animações de entrada ao rolar ---------- */
    const observadorRevelar = new IntersectionObserver((entradas, obs) => {
      entradas.forEach((en) => {
        if (!en.isIntersecting) return;
        en.target.classList.add("visivel");
        en.target.querySelectorAll?.("[data-valor]").forEach(animarContador);
        obs.unobserve(en.target);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".revelar").forEach((el) => observadorRevelar.observe(el));
  </script>
</body>
</html>
