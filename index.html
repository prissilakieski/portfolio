<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prissila Kieski | Criadora de Conteúdo UGC</title>
  <meta name="description" content="Prissila Kieski, criadora de conteúdo UGC. Vídeos autênticos que vendem para marcas de beleza, casa, comida, moda e fitness.">
  <meta name="theme-color" content="#1f1b1e">

  <!-- Fontes do Google: Anton (títulos de impacto, estilo Netflix) e Archivo (corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       CORES E MEDIDAS DO SITE (troque aqui para mudar o visual)
       Estilo: editorial vintage, base grafite (preto suave),
       rosa milk, verde sálvia e rosa neon
       ========================================================== */
    :root {
      /* Paleta gamer girly: branco, verde lima pastel aceso, lilás neon e preto */
      --fundo: #faf7fb;            /* branco levemente lilás */
      --branco: #faf7fb;
      --fundo-2: rgba(255, 255, 255, .6);
      --superficie: #ffffff;       /* cards */
      --superficie-2: #f6ecf8;
      --texto: #17141c;            /* preto: texto principal */
      --texto-suave: #5b5566;      /* texto de apoio */
      --escuro: #17141c;
      --milk: #8e2fb0;             /* lilás (tom escuro, legível no branco): números e destaques */
      --milk-forte: #e07bf5;
      --neon: #e07bf5;             /* lilás neon: botões, brilho e detalhes */
      --neon-texto: #a23bbf;       /* lilás neon para TEXTO no branco */
      --brilho: 0 0 10px rgba(224, 123, 245, .6), 0 0 26px rgba(224, 123, 245, .38);
      --salvia: #4e7a1c;           /* verde lima escuro, legível no branco */
      --salvia-linha: #b8e86a;     /* verde lima aceso: linhas */
      --salvia-fundo: rgba(198, 243, 107, .2);
      --verde-neon: #c6f36b;       /* verde lima das luzes */
      --luz: #ffd76a;              /* luzinhas do fio de fada */
      --borda: rgba(23, 20, 28, .1);
      --titulo: "Anton", "Impact", "Arial Narrow", sans-serif;
      --corpo: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
      --largura: 1240px;
      --gutter: clamp(16px, 4vw, 40px);
      --header-h: 72px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: clip; background: var(--fundo); }
    body {
      margin: 0;
      position: relative;
      background: transparent;
      color: var(--texto);
      font-family: var(--corpo);
      font-size: 1rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 400; }
    p { margin: 0; }
    ul { margin: 0; padding: 0; list-style: none; }
    button, input, textarea { font: inherit; color: inherit; }
    ::selection { background: #f6d3ff; color: var(--escuro); }

    :focus-visible { outline: 2px solid var(--neon-texto); outline-offset: 3px; }


    /* ==========================================================
       ILUSTRAÇÕES VINTAGE
       Arranjos montados com gravuras botânicas antigas em domínio público
       (via Wikimedia Commons): rosas e peônia de Pierre-Joseph Redouté,
       borboletas de Maria Sibylla Merian, papagaio de Jacques Barraband e
       beija-flores de John Gould. Arquivos na pasta "decoracao".
       Para deixar mais forte ou mais suave, mude o "opacity" (0 = invisível, 1 = total).
       ========================================================== */
    /* Buquê da capa em 3 camadas, cada uma balança num ritmo (efeito de brisa) */
    .capa-buque {
      position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;
      width: min(52vw, 760px); aspect-ratio: 1000 / 1100; opacity: .32;
      -webkit-mask-image: radial-gradient(ellipse 100% 100% at 0% 0%, #000 52%, transparent 100%);
              mask-image: radial-gradient(ellipse 100% 100% at 0% 0%, #000 52%, transparent 100%);
    }
    .capa-buque img { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 0 0; animation: brisa 12s ease-in-out infinite; }
    .capa-buque img:nth-child(2) { animation: brisa-b 9s ease-in-out -2s infinite; }
    .capa-buque img:nth-child(3) { animation-duration: 10s; animation-delay: -5s; }
    .capa > .container, .capa > .faixa-marcas { position: relative; z-index: 1; }
    .capa .selo, .capa .frase, .capa-numeros { text-shadow: 0 2px 24px rgba(0, 0, 0, .85); }
    /* "Micro influ" em rosa neon, aceso */
    .capa .selo-micro { color: var(--neon-texto); font-weight: 700; text-shadow: var(--brilho); }


    /* Cordão do lado direito: fio fininho com folhinhas de jiboia e luzinhas de fada piscando */
    .cordao { position: absolute; top: 0; right: 2px; width: 64px; z-index: 5; pointer-events: none; }
    /* --vento: muda conforme a página rola (calculado no JavaScript) e faz o cordão balançar */
    .cordao svg { display: block; overflow: visible; translate: calc(var(--vento, 0) * 1.8px) 0; }
    .cordao .trecho {
      transform-box: fill-box; transform-origin: 50% 0;
      rotate: calc(var(--vento, 0) * .9deg);
      animation: trecho-balanca 4.5s ease-in-out infinite;
    }
    .cordao .luz { animation: piscar 3s ease-in-out infinite; }
    @keyframes trecho-balanca { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
    @keyframes piscar { 0%, 100% { opacity: .45; } 40% { opacity: 1; } 55% { opacity: .7; } 70% { opacity: 1; } }
    /* Cordão da barra de cima: sai do PORTFÓLIO, se enrosca nos itens do menu e desce pela direita */
    .topo > .container { position: relative; z-index: 3; }   /* logo e menu ficam por cima do cordão */
    .vinha-topo { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .vinha-topo.tras { z-index: 0; opacity: .7; }
    .vinha-topo.frente { z-index: 2; }
    .vinha-topo .grupo {
      transform-box: fill-box; transform-origin: 50% 50%;
      rotate: calc(var(--vento, 0) * .7deg);
      animation: trecho-balanca 4s ease-in-out infinite;
    }
    .vinha-topo .luz { animation: piscar 3s ease-in-out infinite; }
    .vinha-topo.frente, .vinha-topo.tras { animation: vinha-onda 5.5s ease-in-out infinite; }
    @keyframes vinha-onda { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(4px, 2px); } }
    /* A brisa: balanço lento e bem pequeno, ancorado no canto de onde as flores "nascem" */    @keyframes brisa {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      30% { transform: rotate(.9deg) translate(2px, 1px); }
      65% { transform: rotate(-.6deg) translate(-1px, 2px); }
    }
    @keyframes brisa-b {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-1deg) translate(-2px, 1px); }
      80% { transform: rotate(.5deg); }
    }

    @media (max-width: 820px) {
      .capa-buque { width: 96vw; opacity: .32; }
    }

    .pular {
      position: absolute; left: 16px; top: -100px; z-index: 200;
      background: var(--texto); color: #fff; padding: 10px 16px;
      font-weight: 600; text-decoration: none;
    }
    .pular:focus { top: 12px; }

    .container { width: 100%; max-width: var(--largura); margin-inline: auto; padding-inline: var(--gutter); }

    section { scroll-margin-top: var(--header-h); }
    .secao { padding-block: clamp(72px, 11vw, 140px); position: relative; }

    .kicker {
      display: inline-block;
      background: var(--salvia-fundo); color: var(--salvia); border: 1px solid var(--salvia-linha);
      font-weight: 600; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase;
      padding: 6px 12px 5px; margin-bottom: 20px;
    }
    .titulo-secao {
      font-family: var(--titulo); font-size: clamp(2.4rem, 6.2vw, 4.4rem); text-transform: uppercase;
      line-height: 1.02; letter-spacing: .01em;
      transition: color .3s ease, text-shadow .3s ease;
    }
    .titulo-secao:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .sub-secao { color: var(--texto-suave); max-width: 600px; margin-top: 18px; font-size: 1.05rem; }
    .cabecalho-secao { margin-bottom: clamp(36px, 6vw, 64px); }

    /* ---------- Botões ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 14px 30px; border-radius: 0; border: 1px solid var(--milk);
      font-weight: 600; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
      transition: color .3s ease, background-color .3s ease, border-color .3s ease, text-shadow .3s ease, box-shadow .3s ease;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; fill: currentColor; }
    .btn-vermelho { background: var(--neon); border-color: var(--neon); color: var(--escuro); }
    .btn-vermelho:hover, .btn-vermelho:focus-visible {
      background: var(--btn-hover-bg, #141214); border-color: var(--btn-hover-bg, #141214); color: var(--btn-hover-cor, #fff);
      box-shadow: 0 0 30px rgba(224, 123, 245, .7);
    }
    .btn-cinza { background: transparent; color: var(--texto); border-color: var(--texto); }
    .btn-cinza:hover, .btn-cinza:focus-visible { color: var(--neon-texto); border-color: var(--neon); text-shadow: var(--brilho); }

    /* ---------- Blocos de imagem em gradiente ---------- */
    .midia { position: relative; overflow: hidden; width: 100%; height: 100%; background-color: var(--superficie-2); background-size: cover; background-position: center; }
    img.midia { object-fit: cover; }

    /* ==========================================================
       1. CAPA
       ========================================================== */
    /* Barra superior em verde botânico */
    .topo {
      position: fixed; inset: 0 0 auto 0; z-index: 100; height: var(--header-h);
      --texto: #17141c; --neon-texto: #8a1fa8; --milk: #8a1fa8;
      --brilho: 0 0 10px rgba(224, 123, 245, .9), 0 0 24px rgba(224, 123, 245, .55);
      background: linear-gradient(90deg, rgba(222, 248, 172, .95), rgba(205, 244, 140, .95));
      box-shadow: 0 4px 30px rgba(198, 243, 107, .45);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: background-color .3s ease, box-shadow .3s ease;
    }
    .topo.rolado { box-shadow: 0 6px 34px rgba(198, 243, 107, .6), 0 1px 0 rgba(23, 20, 28, .08); }
    .topo .container { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo {
      font-family: var(--titulo); font-size: 1.55rem; font-weight: 500; letter-spacing: .06em;
      color: var(--texto); text-decoration: none; text-transform: uppercase; line-height: 1; white-space: nowrap;
      transition: color .3s ease, text-shadow .3s ease;
    }
    .logo:hover, .logo:focus-visible { color: var(--neon-texto); text-shadow: var(--brilho); }
    .menu { display: flex; gap: 12px; align-items: center; }
    /* Botões da barra: minimalistas, com fundo branco translúcido para o cordão nunca atrapalhar a leitura */
    .menu a {
      display: block; padding: 6px 13px; text-decoration: none;
      font-weight: 600; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--texto); background: rgba(255, 255, 255, .62);
      border: 1px solid rgba(224, 123, 245, .5); border-radius: 999px;
      transition: color .3s ease, background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .menu a:hover, .menu a:focus-visible {
      color: var(--neon-texto); background: #ffffff; border-color: var(--neon); text-shadow: none;
      box-shadow: 0 0 12px rgba(224, 123, 245, .55);
    }
    .menu a.ativo { color: var(--neon-texto); background: #ffffff; border-color: var(--neon); box-shadow: 0 0 10px rgba(224, 123, 245, .45); }    /* Botão Sazonal ao lado do PORTFÓLIO: abre a página de Natal e Black Friday em outra aba */
    .marca-topo { display: flex; align-items: center; gap: 14px; }
    .btn-sazonal {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
      font-weight: 700; font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; text-decoration: none;
      color: #2a0b38; background: linear-gradient(180deg, #f6d2ff, #e07bf5);
      box-shadow: 0 0 10px rgba(224, 123, 245, .8), 0 0 24px rgba(224, 123, 245, .4);
      transition: transform .45s cubic-bezier(.34, 1.7, .5, 1), background .3s ease, box-shadow .3s ease;
    }
    .btn-sazonal::before { content: "✦"; font-size: .8rem; }
    .btn-sazonal:hover, .btn-sazonal:focus-visible {
      transform: translateY(-3px) scale(1.06); background: linear-gradient(180deg, #e8fbc4, #c6f36b);
      box-shadow: 0 0 12px rgba(198, 243, 107, .9), 0 0 26px rgba(198, 243, 107, .5);
    }    .btn-menu { display: none; width: 46px; height: 46px; border: 0; background: transparent; cursor: pointer; position: relative; }
    .btn-menu span, .btn-menu span::before, .btn-menu span::after {
      position: absolute; left: 11px; width: 24px; height: 1.5px; background: var(--texto);
      transition: transform .25s ease, background-color .25s ease;
    }
    .btn-menu span { top: 22px; }
    .btn-menu span::before { content: ""; left: 0; top: -8px; }
    .btn-menu span::after { content: ""; left: 0; top: 8px; }
    .btn-menu[aria-expanded="true"] span { background: transparent; }
    .btn-menu[aria-expanded="true"] span::before { transform: translateY(8px) rotate(45deg); }
    .btn-menu[aria-expanded="true"] span::after { transform: translateY(-8px) rotate(-45deg); }

    /* Capa: preto translúcido, com cores próprias para o texto claro */
    .capa {
      --texto: #f6f3f1; --texto-suave: #d6ced3; --borda: rgba(255, 255, 255, .16);
      --milk: #f0c6ff; --neon-texto: #f2a8ff; --salvia: #c6f36b;
      --brilho: 0 0 10px rgba(224, 123, 245, .75), 0 0 28px rgba(224, 123, 245, .5);
      --btn-hover-bg: #ffffff; --btn-hover-cor: #141214;
      --lilas-neon: #e58cff; --lilas-brilho: 0 0 8px rgba(229, 140, 255, .9), 0 0 22px rgba(229, 140, 255, .6), 0 0 44px rgba(229, 140, 255, .35);
      color: var(--texto);
      position: relative; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding-top: calc(var(--header-h) + 36px);
      background:
        radial-gradient(ellipse 55% 60% at 80% 30%, rgba(224, 123, 245, .26), transparent 70%),
        radial-gradient(ellipse 45% 45% at 6% 100%, rgba(198, 243, 107, .14), transparent 70%),
        rgba(20, 16, 26, .93);
      overflow: hidden;
    }
    .capa-grade { display: block; padding-bottom: clamp(40px, 6vw, 72px); }
    .selo {
      display: inline-flex; align-items: center; gap: 12px; margin-bottom: 22px;
      font-weight: 500; font-size: .76rem; letter-spacing: .26em; text-transform: uppercase; color: var(--salvia);
    }
    /* UGC como letreiro de neon: tubo de luz rosa-lilás que pisca de vez em quando */
    .selo b {
      font-family: var(--titulo); font-weight: 400; font-size: 1.15rem; letter-spacing: .22em; line-height: 1;
      padding: 7px 10px 6px 14px; border: 2px solid #ffc4f2; border-radius: 6px; background: transparent;
      color: #fff2fc;
      text-shadow: 0 0 4px #fff, 0 0 10px #f7a6f0, 0 0 22px #e07bf5, 0 0 44px #e07bf5;
      box-shadow: 0 0 6px #ffd6f5, 0 0 16px rgba(224, 123, 245, .85), 0 0 36px rgba(224, 123, 245, .5), inset 0 0 12px rgba(224, 123, 245, .55);
      animation: letreiro 5s infinite;
    }
    @keyframes letreiro {
      0%, 8%, 10%, 12%, 46%, 50%, 100% { opacity: 1; filter: none; }
      9%, 11%, 48% { opacity: .35; filter: saturate(.5); }
    }
    .capa h1 {
      font-family: var(--titulo); text-transform: uppercase; font-weight: 500; color: #ffffff;
      font-size: clamp(3.3rem, 10.5vw, 9rem); line-height: .9; letter-spacing: -0.015em;
    }
    .capa h1 span { transition: color .35s ease, text-shadow .35s ease; }
    .capa h1 span:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    /* KIESKI em lilás neon */
    .capa h1 .linha-2 { display: inline-block; color: var(--lilas-neon); text-shadow: var(--lilas-brilho); padding-right: .08em; }
    .capa h1 .linha-2:hover { color: #f6c4ff; text-shadow: 0 0 12px rgba(229, 140, 255, 1), 0 0 34px rgba(229, 140, 255, .8), 0 0 60px rgba(229, 140, 255, .5); }
    .capa .frase { margin-top: 28px; max-width: 540px; font-size: clamp(1.05rem, 2vw, 1.22rem); color: var(--texto-suave); line-height: 1.7; }
    .capa .frase strong { color: var(--milk); font-weight: 600; transition: color .3s ease, text-shadow .3s ease; }
    .capa .frase strong:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .capa .frase .local { color: var(--salvia); font-weight: 700; }   /* idade, cidade e estado em verde e negrito */
    .capa-botoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }

    /* Métricas da capa: ganham destaque forte ao passar o mouse */
    .capa-numeros {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
      margin-top: 48px; max-width: 560px; border-top: 1px solid var(--borda); padding-top: 24px;
    }
    .capa-numeros li { position: relative; padding-bottom: 10px; transform-origin: left bottom; transition: transform .4s cubic-bezier(.2, .7, .2, 1); }
    .capa-numeros li::after {
      content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
      background: var(--neon); box-shadow: 0 0 12px var(--neon); transform: scaleX(0); transform-origin: left; transition: transform .45s ease;
    }
    .capa-numeros strong {
      display: block; font-family: var(--titulo); font-weight: 500; color: var(--milk);
      font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.05; transition: color .3s ease, text-shadow .3s ease;
    }
    .capa-numeros li:hover { transform: translateY(-6px) scale(1.14); }
    .capa-numeros li:hover::after { transform: scaleX(1); }
    .capa-numeros li:hover strong { color: var(--neon-texto); text-shadow: var(--brilho); }
    .capa-numeros li:hover span { color: var(--texto); }
    .capa-numeros span { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--texto-suave); transition: color .3s ease; }

    /* Foto da capa integrada: ocupa o lado direito e se funde com o fundo pelas bordas */
    .capa-texto { max-width: min(640px, 54%); }
    .capa-foto {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 0; width: min(62vw, 1060px); pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 40%), linear-gradient(to top, transparent 0%, #000 30%);
      -webkit-mask-composite: source-in; mask-composite: intersect;
      mask-image: linear-gradient(to right, transparent 0%, #000 40%), linear-gradient(to top, transparent 0%, #000 30%);
    }
    /* mais contraste e nitidez na foto da capa */
    .capa-foto .midia { width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; filter: contrast(1.14) saturate(1.08) brightness(1.03); image-rendering: -webkit-optimize-contrast; }
    .capa-foto .iniciais {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 2;
      font-family: var(--titulo); font-size: clamp(6rem, 16vw, 11rem); color: rgba(255,255,255,.5); pointer-events: none;
    }

    /* "Já trabalhei com": faixa em lilás neon, estilo gamer */
    .faixa-marcas {
      position: relative; overflow: hidden; background: #0b0a0d;
      border-top: 1px solid rgba(229, 140, 255, .55); border-bottom: 1px solid rgba(229, 140, 255, .55);
      box-shadow: 0 0 18px rgba(229, 140, 255, .35), inset 0 0 22px rgba(229, 140, 255, .12);
    }
    .faixa-marcas::after {
      /* linhas de tela de monitor (scanlines) */
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px);
    }
    .faixa-marcas .rotulo {
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; padding: 0 26px 0 var(--gutter);
      background: linear-gradient(90deg, #0b0a0d 72%, transparent);
      font-size: .68rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--verde-neon);
      text-shadow: 0 0 8px rgba(198, 243, 107, .9), 0 0 22px rgba(198, 243, 107, .5);
    }
    .faixa-trilho { display: flex; width: max-content; animation: deslizar 60s linear infinite; }
    .faixa-marcas:hover .faixa-trilho { animation-play-state: paused; }
    .faixa-trilho ul { display: flex; }
    .faixa-trilho li {
      padding: 18px 26px; white-space: nowrap;
      font-family: var(--titulo); font-size: 1.3rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--lilas-neon); text-shadow: var(--lilas-brilho);
      display: flex; align-items: center; gap: 26px; transition: color .3s ease, text-shadow .3s ease;
    }
    .faixa-trilho li:hover { color: #ffffff; text-shadow: 0 0 10px rgba(224, 123, 245, 1), 0 0 30px rgba(224, 123, 245, .8), 0 0 50px rgba(224, 123, 245, .5); }
    .faixa-trilho li::after { content: ""; width: 6px; height: 6px; background: var(--verde-neon); box-shadow: 0 0 10px var(--verde-neon); transform: rotate(45deg); }
    @keyframes deslizar { to { transform: translateX(-50%); } }

    /* ==========================================================
       2. SOBRE MIM
       ========================================================== */
    /* Seções claras: o fundo passa do preto para o branco e volta em degradê suave, sem linha de corte.
       As cores de texto se ajustam sozinhas dentro delas. */
    .tema-claro {
      --texto: #141214; --texto-suave: #5a525d; --borda: rgba(20, 18, 20, .12);
      --superficie: #ffffff; --superficie-2: #efe9ec;
      --milk: #6f5a78; --milk-forte: #8a7593;
      --neon-texto: #a23bbf; --brilho: 0 0 10px rgba(224, 123, 245, .6), 0 0 26px rgba(224, 123, 245, .38);
      --salvia: #4b6844; --salvia-linha: #8aa37f; --salvia-fundo: rgba(95, 124, 86, .1);
      color: var(--texto);
    }
    .tema-claro::before {
      content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background: none;
    }

    .secao.tema-claro { padding-block: clamp(90px, 11vw, 150px); }

    /* Sobre mim: parede verde clarinha com LED neon de coração (canto superior direito) e o fio descendo */
    /* Fundo verde bem clarinho (o mesmo tom do selo "Sobre mim"), que vai clareando aos poucos
       até virar o branco da próxima seção: transição longa e suave, sem marcação */
    .parede-neon {
      background: linear-gradient(180deg,
        #eef8d9 0%, #eff8db 45%, #f1f8e0 58%, #f3f8e6 68%, #f5f8ec 77%,
        #f7f8f2 85%, #f9f7f7 93%, var(--fundo) 100%);
    }
    #sobre.parede-neon { padding-block: clamp(150px, 14vw, 210px); }
    #sobre > .container { position: relative; z-index: 2; }
    .neon-sobre { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
    .neon-sobre path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    /* fio: mais fino e suave, para não atrapalhar a leitura */
    .neon-fio { opacity: .6; filter: drop-shadow(0 0 4px #ff6fd8) drop-shadow(0 0 10px rgba(255, 63, 198, .6)); }
    .neon-fio .tubo { stroke: #ff5fd2; stroke-width: 5; }
    .neon-fio .nucleo { stroke: #fff0fa; stroke-width: 1.6; }
    /* coração: bem aceso, piscando como letreiro vintage */
    .neon-coracao-g {
      filter: drop-shadow(0 0 5px #ff6fd8) drop-shadow(0 0 14px #ff3fc6) drop-shadow(0 0 32px rgba(230, 20, 170, .85));
      animation: letreiro-vintage 6s infinite;
    }
    .neon-coracao-g .tubo { stroke: #ff3fc6; stroke-width: 10; }
    .neon-coracao-g .nucleo { stroke: #fff2fb; stroke-width: 3.4; }
    @keyframes letreiro-vintage {
      0%, 6%, 9%, 12%, 40%, 44%, 72%, 100% { opacity: 1; }
      7%, 10.5%, 42% { opacity: .2; }
      73%, 75% { opacity: .55; }
    }
    /* texto com um leve contorno da cor da parede, para ficar legível por cima do fio */
    .parede-neon .sobre-texto { text-shadow: 0 0 10px #eff8db, 0 0 4px #eff8db, 0 0 2px #eff8db; }
    .parede-neon .sobre-texto .entregas li { background: rgba(239, 248, 219, .9); }
    .parede-neon .polaroid-foto { box-shadow: 0 24px 50px rgba(40, 60, 20, .18), 0 0 30px rgba(255, 95, 210, .18); }
    /* Sobre mim: clean e minimalista, como um provador da Zara */
    .sobre-grade { display: grid; grid-template-columns: minmax(220px, 360px) 1fr; gap: clamp(40px, 9vw, 140px); align-items: center; }
    /* Foto do Sobre mim animada: inclina em 3D seguindo o mouse, aproxima, ganha reflexo de luz
       e o fio da moldura se afasta e acende em pink */
    .polaroid { margin: 0; perspective: 900px; }
    .polaroid-foto {
      position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--superficie-2);
      outline: 1px solid var(--texto); outline-offset: 12px;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .6s cubic-bezier(.2, .7, .2, 1), outline-offset .6s ease, outline-color .6s ease, box-shadow .6s ease;
      will-change: transform;
    }
    .polaroid-foto .midia { width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1), filter .8s ease; }
    .polaroid-foto::after {
      /* reflexo de luz que segue o mouse */
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s ease;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, .45), transparent 55%);
    }
    .polaroid:hover .polaroid-foto {
      outline-color: var(--neon); outline-offset: 20px;
      box-shadow: 0 30px 60px rgba(20, 18, 20, .22), 0 0 34px rgba(224, 123, 245, .25);
    }
    .polaroid.mexendo .polaroid-foto { transition: transform .12s linear, outline-offset .6s ease, outline-color .6s ease, box-shadow .6s ease; }
    .polaroid:hover .polaroid-foto .midia { transform: scale(1.07); filter: saturate(1.08) contrast(1.03); }
    .polaroid:hover .polaroid-foto::after { opacity: 1; }    .polaroid figcaption {
      margin-top: 30px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      font-size: .66rem; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--texto);
    }
    .polaroid figcaption small { font-size: inherit; letter-spacing: inherit; font-weight: 500; color: var(--texto-suave); }
    .sobre-texto p { color: var(--texto-suave); font-size: 1.04rem; margin-top: 16px; max-width: 480px; }
    .sobre-texto p:first-of-type { margin-top: 22px; }
    .sobre-texto p strong { color: var(--texto); font-weight: 700; }
    .polaroid figcaption { transition: color .4s ease; }
    .polaroid:hover figcaption { color: var(--neon-texto); }
    .sobre-texto .entregas li { border-radius: 0; border-color: var(--texto); background: transparent; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; }
    /* Sobre mim sem foto: vira uma faixa compacta */
    .sobre-grade.sem-foto { display: block; max-width: 860px; }
    .sobre-grade.sem-foto .cabecalho-secao { margin-bottom: 0; }
    .sobre-grade.sem-foto .titulo-secao { font-size: clamp(2rem, 4.6vw, 3.2rem); }
    .sobre-grade.sem-foto .sobre-texto p:first-of-type { margin-top: 14px; }
    .entregas { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; }
    .entregas li {
      padding: 8px 14px; border: 1px solid var(--borda); border-radius: 999px;
      display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: .9rem;
      transition: color .3s ease, text-shadow .3s ease, border-color .3s ease;
    }
    .entregas li:hover { border-color: var(--neon); }
    .entregas li:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .entregas svg { width: 16px; height: 16px; color: var(--salvia); flex-shrink: 0; }

    /* ==========================================================
       3. CONTEÚDOS DE DESTAQUE
       ========================================================== */
    .destaques-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 3vw, 36px); max-width: 900px; margin-inline: auto; }
    .destaque {
      display: block; text-decoration: none; color: inherit;
      background: var(--superficie); overflow: hidden; position: relative; border: 1px solid var(--borda);
      transition: transform .4s ease, box-shadow .4s ease, border-color .4s ease;
    }
    .destaque:hover, .destaque:focus-visible {
      transform: translateY(-12px) scale(1.03); border-color: var(--verde-neon);
      box-shadow: 0 0 0 2px var(--verde-neon), 0 0 26px rgba(198, 243, 107, .8), 0 26px 50px rgba(198, 243, 107, .3);
    }
    .destaque-capa { aspect-ratio: 9 / 16; position: relative; overflow: hidden; }
    .destaque-capa .midia { transition: transform .7s ease; }
    .destaque:hover .destaque-capa .midia { transform: scale(1.05); }
    .ranking {
      position: absolute; top: 8px; left: 16px; z-index: 2;
      font-family: var(--titulo); font-size: 4.2rem; line-height: 1; color: #fff;
      text-shadow: 0 2px 14px rgba(0,0,0,.35);
    }
    .tag-alta {
      position: absolute; top: 16px; right: 16px; z-index: 2;
      background: var(--neon); color: var(--escuro); font-size: .64rem; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; padding: 6px 10px 5px;
    }
    .play {
      position: absolute; left: 50%; top: 50%; z-index: 2;
      width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
      background: rgba(255, 255, 255, .85); border: 1px solid #fff;
      display: grid; place-items: center; backdrop-filter: blur(4px);
      transition: background-color .3s ease, transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .play svg { width: 26px; height: 26px; margin-left: 4px; fill: var(--escuro); transition: fill .3s ease; }
    .destaque:hover .play, .destaque:focus-visible .play,
    .trabalho:hover .play-mini, .trabalho:focus-visible .play-mini {
      background: var(--verde-neon); border-color: var(--verde-neon); transform: scale(1.08); box-shadow: 0 0 26px rgba(224, 123, 245, .7);
    }
    .destaque:hover .play svg, .destaque:focus-visible .play svg,
    .trabalho:hover .play-mini svg, .trabalho:focus-visible .play-mini svg { fill: var(--escuro); }
    .destaque-info { padding: 22px 22px 26px; }
    .destaque-numero {
      font-family: var(--titulo); font-weight: 500; font-size: clamp(2.4rem, 4.4vw, 3.3rem); line-height: 1; color: var(--milk);
      transition: color .3s ease, text-shadow .3s ease;
    }
    .destaque:hover .destaque-numero { color: var(--salvia); text-shadow: 0 0 12px rgba(198, 243, 107, .9); }
    .destaque-rotulo {
      display: inline-block; margin-top: 10px; color: var(--salvia); border: 1px solid var(--salvia-linha);
      font-weight: 600; font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; padding: 4px 9px 3px;
    }
    .destaque-titulo { margin-top: 16px; font-family: var(--corpo); font-weight: 600; font-size: 1.08rem; line-height: 1.35; }
    .destaque-contexto { margin-top: 6px; color: var(--texto-suave); font-size: .94rem; }
    .destaque-insights { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--borda); display: grid; gap: 7px; }
    .destaque-insights li { display: flex; gap: 8px; align-items: flex-start; font-size: .84rem; line-height: 1.45; color: var(--texto); }
    .destaque-insights svg { width: 14px; height: 14px; color: var(--neon-texto); flex-shrink: 0; margin-top: 3px; }

    /* ==========================================================
       4. TRABALHOS POR NICHO (catálogo) e TIKTOK SHOP
       ========================================================== */
    .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
    /* Botões dos nichos: lilás neon; ao passar o mouse dão um salto e ficam verde lima */
    .filtro {
      border: 1px solid var(--neon); background: rgba(224, 123, 245, .14); color: #8a1fa8;
      padding: 10px 18px; border-radius: 999px; cursor: pointer;
      font-weight: 600; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      box-shadow: 0 0 10px rgba(224, 123, 245, .45), inset 0 0 8px rgba(224, 123, 245, .18);
      transition: transform .45s cubic-bezier(.34, 1.7, .5, 1), background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
    }
    .filtro:hover, .filtro:focus-visible {
      transform: translateY(-6px) scale(1.07);
      background: var(--verde-neon); border-color: var(--verde-neon); color: var(--escuro); text-shadow: none;
      box-shadow: 0 10px 24px rgba(198, 243, 107, .55), 0 0 18px rgba(198, 243, 107, .85);
    }
    .filtro[aria-pressed="true"] {
      background: var(--neon); border-color: var(--neon); color: var(--escuro); text-shadow: none;
      box-shadow: 0 0 14px rgba(224, 123, 245, .85), 0 0 30px rgba(224, 123, 245, .45);
    }
    .filtro[aria-pressed="true"]:hover { background: var(--verde-neon); border-color: var(--verde-neon); box-shadow: 0 10px 24px rgba(198, 243, 107, .55), 0 0 18px rgba(198, 243, 107, .85); }

    .filtro-tts { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
    .filtro-tts svg { width: 14px; height: 14px; fill: currentColor; }
    .filtros:has(+ .subfiltros:not([hidden])) { margin-bottom: 12px; }
    .subfiltros { align-items: center; padding: 12px 14px; background: var(--salvia-fundo); border: 1px solid var(--salvia-linha); }
    .subfiltros[hidden] { display: none; }
    .subfiltros-rotulo { font-size: .68rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--salvia); margin-right: 4px; }
    .filtro-sub { padding: 8px 14px; }

    .fileira { margin-bottom: 34px; }
    .fileira[hidden] { display: none; }
    .fileira-topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .fileira-titulo { font-family: var(--titulo); font-weight: 500; font-size: 1.7rem; line-height: 1.1; }
    .fileira-titulo small {
      font-family: var(--corpo); color: var(--texto-suave); font-weight: 500;
      font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; margin-left: 12px;
    }
    .fileira-nicho {
      display: block; width: fit-content; font-family: var(--corpo);
      font-size: .64rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase;
      color: var(--salvia); border: 1px solid var(--salvia-linha); padding: 3px 8px 2px; margin-bottom: 8px;
    }
    .setas { display: flex; gap: 8px; }
    .seta {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(20,18,20,.2);
      background: var(--superficie); color: var(--texto); cursor: pointer; display: grid; place-items: center;
      transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
    }
    .seta:hover { border-color: var(--neon); color: var(--neon-texto); box-shadow: 0 0 16px rgba(224,123,245,.45); }
    .seta svg { width: 18px; height: 18px; }
    .trilho {
      display: grid; grid-auto-flow: column; grid-auto-columns: clamp(176px, 22vw, 272px);
      gap: 18px; overflow-x: auto; overscroll-behavior-x: contain;
      padding: 26px 14px 30px; margin-inline: -14px;
      scroll-snap-type: x mandatory; scroll-padding-inline: 14px;
      scrollbar-width: thin; scrollbar-color: var(--salvia-linha) transparent;
    }
    .trilho::-webkit-scrollbar { height: 5px; }
    .trilho::-webkit-scrollbar-thumb { background: var(--salvia-linha); border-radius: 3px; }
    .catalogo.filtrado .trilho {
      grid-auto-flow: row; grid-auto-columns: auto;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 272px)); overflow: visible;
    }
    .catalogo.filtrado .setas { display: none; }

    .trabalho {
      scroll-snap-align: start; position: relative; display: block; aspect-ratio: 9 / 16; overflow: hidden;
      text-decoration: none; color: inherit; background: var(--superficie-2);
      transition: transform .5s cubic-bezier(.34, 1.6, .5, 1), box-shadow .4s ease;
    }
    .trabalho:hover, .trabalho:focus-visible {
      transform: translateY(-12px) scale(1.06); z-index: 3;
      box-shadow: 0 0 0 2px var(--verde-neon), 0 0 22px rgba(198, 243, 107, .85), 0 22px 40px rgba(198, 243, 107, .35);
    }
    .trabalho .midia { position: absolute; inset: 0; }
    .trabalho img.midia { object-position: 50% 30%; }
    .trabalho-tag {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      font-size: .6rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
      color: var(--escuro); background: rgba(255, 255, 255, .92); padding: 5px 8px 4px;
    }
    .trabalho-info {
      position: absolute; inset: auto 0 0 0; z-index: 2; padding: 44px 12px 12px; color: #fff;
      background: linear-gradient(0deg, rgba(20,17,19,.92) 0%, rgba(20,17,19,.6) 55%, transparent 100%);
    }
    .trabalho-info h4 { margin: 0; font-family: var(--titulo); font-weight: 500; font-size: 1.12rem; line-height: 1.2; transition: color .3s ease, text-shadow .3s ease; }
    .trabalho:hover .trabalho-info h4 { color: var(--verde-neon); text-shadow: 0 0 10px rgba(198, 243, 107, .8); }
    .trabalho-info .formato { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.85); font-weight: 500; margin-top: 5px; }
    .trabalho-info .desc {
      font-size: .8rem; color: #fff; line-height: 1.4;
      max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s ease, opacity .35s ease, margin .35s ease;
    }
    .trabalho:hover .desc, .trabalho:focus-visible .desc { max-height: 90px; opacity: 1; margin-top: 8px; }
    .play-mini { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
    .play-mini svg { width: 20px; height: 20px; }

    /* TikTok Shop */
    .tts-topo { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(24px, 5vw, 64px); align-items: end; margin-bottom: clamp(20px, 4vw, 36px); }
    .tts-topo .cabecalho-secao { margin-bottom: 0; }
    /* Título do TikTok Shop aceso em neon */
    .tts-neon {
      color: #b829b8;
      text-shadow: 0 0 4px rgba(255, 170, 240, .9), 0 0 14px rgba(224, 123, 245, .85), 0 0 34px rgba(224, 123, 245, .55), 0 0 60px rgba(224, 123, 245, .3);
      animation: neon-pisca 7s infinite;
    }
    .tts-neon:hover { color: #d23ad2; }
    @keyframes neon-pisca {
      0%, 17%, 21%, 24%, 60%, 64%, 100% { opacity: 1; }
      19%, 22.5%, 62% { opacity: .62; }
    }
    .tts-selo {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;
      background: var(--neon); color: var(--escuro); padding: 6px 12px 5px;
      font-size: .7rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    }
    .tts-selo svg { width: 16px; height: 16px; fill: currentColor; }
    .tts-lista { display: grid; gap: 0; border-top: 1px solid var(--borda); }
    .tts-lista li {
      display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--borda);
      font-weight: 500; transition: color .3s ease, text-shadow .3s ease;
    }
    .tts-lista li:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .tts-lista svg { width: 18px; height: 18px; color: var(--salvia); flex-shrink: 0; margin-top: 3px; }
    .tts-aviso { color: var(--texto-suave); font-size: .9rem; margin-top: 6px; }

    /* Janela do player de vídeo */
    .janela-video {
      width: fit-content; max-width: calc(100vw - 32px); max-height: calc(100vh - 24px);
      padding: 16px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); overflow: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .janela-video::backdrop { background: rgba(246, 243, 241, .85); backdrop-filter: blur(6px); }
    .janela-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .janela-topo h2 { font-family: var(--titulo); font-weight: 500; font-size: 1.45rem; max-width: 22ch; }
    .fechar-video {
      width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(20,18,20,.2); cursor: pointer;
      background: transparent; color: var(--texto); font-size: 1.6rem; line-height: 1;
      transition: color .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .fechar-video:hover { color: var(--neon-texto); border-color: var(--neon); box-shadow: 0 0 16px rgba(224,123,245,.45); }
    /* Player: a altura acompanha a tela, então o vídeo aparece inteiro sem rolar */
    .moldura-video {
      height: min(calc(100vh - 130px), 640px); aspect-ratio: 9 / 16; width: auto;
      max-width: calc(100vw - 64px); margin-inline: auto; overflow: hidden; background: #000;
    }
    .moldura-video iframe { width: 100%; height: 100%; border: 0; display: block; }
    .aviso-local { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; }

    /* ==========================================================
       5. SERVIÇOS
       ========================================================== */
    .servicos-grade {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px; background: var(--borda); border: 1px solid var(--borda);
    }
    .servico { background: var(--superficie); padding: 34px 28px; position: relative; overflow: hidden; transition: background-color .4s ease; }
    .servico::before {
      content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 2px;
      background: var(--neon); box-shadow: 0 0 12px var(--neon);
      transform: scaleX(0); transform-origin: left; transition: transform .45s ease;
    }
    .servico:hover { background: var(--superficie-2); }
    .servico:hover::before { transform: scaleX(1); }
    .servico-num { font-family: var(--titulo); font-size: 2.6rem; line-height: 1; color: var(--salvia-linha); }
    .servico h3 { font-family: var(--titulo); font-weight: 500; font-size: 1.7rem; margin-top: 16px; transition: color .3s ease, text-shadow .3s ease; }
    .servico:hover h3 { color: var(--neon-texto); text-shadow: var(--brilho); }

    function animarContador(el) {

      if (reduzir) { el.textContent = prefixo + formatar(final, casas) + sufixo; return; }
      const duracao = 1800;
      const inicio = performance.now();
      function passo(agora) {
        const p = Math.min((agora - inicio) / duracao, 1);
        const suave = 1 - Math.pow(1 - p, 3);
        el.textContent = prefixo + formatar(final * suave, casas) + sufixo;
        if (p < 1) requestAnimationFrame(passo);

      requestAnimationFrame(passo);

    /* ---------- Cordão de jiboia com fio de fada (lado direito, da capa ao rodapé) ---------- */
    let alturaCordao = 0;
    function desenharCordao() {
      const el = $("#cordao");
      if (!el) return;
      const H = document.documentElement.scrollHeight;
      if (Math.abs(H - alturaCordao) < 40) return;
      alturaCordao = H;
      const k = window.innerWidth < 600 ? 0.62 : 1;            // no celular fica mais fininho
      const W = 70 * k;
      const fioX = (y) => W * 0.55 + Math.sin(y / 140) * 10 * k + Math.sin(y / 53) * 3 * k;
      const pontos = [];
      for (let y = 0; y <= H; y += 8) pontos.push(`${fioX(y).toFixed(1)} ${y}`);

      // folhinhas de jiboia (coração com ponta fina), bem cheias, agrupadas em trechos que balançam
      const cores = ["#7fb84f", "#94c95e", "#a9d871", "#c0e68e", "#d6efab", "#6ea845"];
      const folha = "M0 0 C2 -6 10 -8 14 -4 C16 -2 17 0 19 1 C16 3 13 7 8 7 C3 6 1 4 0 0 Z";
      const TRECHO = 340;
      let trechos = "", atual = "", inicioTrecho = 0, i = 0;
      for (let y = 6; y < H; y += 7 + ((i * 7) % 6)) {
        i++;
        if (y - inicioTrecho > TRECHO) {
          trechos += `<g class="trecho" style="animation-delay:-${(inicioTrecho / 97) % 6}s">${atual}</g>`;
          atual = ""; inicioTrecho = y;
        }
        const lado = i % 2 ? 1 : -1;
        const x = fioX(y) + lado * (1 + (i % 3)) * k;
        const tam = (0.32 + ((i * 53) % 34) / 100) * k;       // folhas pequenas, de tamanhos variados
        const ang = lado > 0 ? -40 + ((i * 17) % 70) : 150 + ((i * 13) % 70);
        atual += `<path d="${folha}" transform="translate(${x.toFixed(1)} ${y}) rotate(${ang}) scale(${tam.toFixed(2)})" fill="${cores[(i * 5) % cores.length]}" fill-opacity=".93"/>`;
      }
      trechos += `<g class="trecho">${atual}</g>`;

      // fio de fada: luzinhas amarelas acesas, cada uma piscando no seu ritmo
      let luzes = "", j = 0;
      for (let y = 12; y < H; y += 26) {
        j++;
        const x = fioX(y) + (j % 2 ? 3 : -3) * k;
        luzes += `<g class="luz" style="animation-delay:-${((j * 0.37) % 3).toFixed(2)}s;animation-duration:${(1.8 + (j % 6) * 0.45).toFixed(2)}s">
          <circle cx="${x.toFixed(1)}" cy="${y}" r="${11 * k}" fill="url(#halo-luz)"/><circle cx="${x.toFixed(1)}" cy="${y}" r="${2.1 * k}" fill="#fffbe3"/></g>`;
      }
      el.style.height = `${H}px`;
      el.style.width = `${W}px`;
      el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        <defs><radialGradient id="halo-luz"><stop offset="0" stop-color="#fff1a8" stop-opacity="1"/><stop offset=".25" stop-color="#ffd76a" stop-opacity=".75"/><stop offset=".6" stop-color="#ffc94a" stop-opacity=".22"/><stop offset="1" stop-color="#ffc94a" stop-opacity="0"/></radialGradient></defs>
        <path d="M${pontos.join(" L")}" fill="none" stroke="#b8a57c" stroke-width="${0.9 * k}" opacity=".75"/>
        ${trechos}${luzes}</svg>`;
    }
    desenharCordao();
    window.addEventListener("load", desenharCordao);
    let esperaCordao;
    window.addEventListener("resize", () => { clearTimeout(esperaCordao); esperaCordao = setTimeout(() => { alturaCordao = 0; desenharCordao(); }, 250); });
    if ("ResizeObserver" in window) new ResizeObserver(() => desenharCordao()).observe(document.body);

    // Balanço do cordão enquanto a página rola: quanto mais rápido rola, mais ele balança, e depois acalma
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const raiz = document.documentElement;
      let vento = 0, alvo = 0, ultimoY = window.scrollY, rodando = false;
      const animarVento = () => {
        vento += (alvo - vento) * 0.08;
        alvo *= 0.92;
        raiz.style.setProperty("--vento", vento.toFixed(2));
        if (Math.abs(vento) > 0.02 || Math.abs(alvo) > 0.02) requestAnimationFrame(animarVento);
        else { raiz.style.setProperty("--vento", "0"); rodando = false; }
      };
      window.addEventListener("scroll", () => {
        const v = window.scrollY - ultimoY; ultimoY = window.scrollY;
        alvo = Math.max(-7, Math.min(7, alvo + v * 0.07));
        if (!rodando) { rodando = true; requestAnimationFrame(animarVento); }
      }, { passive: true });
    }

    /* ---------- Cordão da barra de cima: começa no PORTFÓLIO, enrosca no menu e desce pela direita ---------- */
    function desenharCordaoTopo() {
      const topo = $("#topo"), tras = $("#vinhaTopoTras"), frente = $("#vinhaTopoFrente");
      if (!topo || !tras) return;
      const rt = topo.getBoundingClientRect();
      const W = rt.width, H = rt.height, cy = H / 2;
      const alvos = [$("#logo")];
      if (window.innerWidth > 1120) alvos.push(...document.querySelectorAll("#menu a"));   // no celular o menu fica escondido
      const pts = [];
      // o cordão passa só por baixo dos botões, numa linha ondulada suave
      const base = cy + 23;
      const inicio = $("#logo").getBoundingClientRect().left - rt.left - 4;
      const fimX = W - (window.innerWidth < 600 ? 21.5 : 33.5);
      for (let xx = inicio; xx < fimX - 14; xx += 3) pts.push([xx, base + Math.sin(xx / 38) * 2.2 + Math.sin(xx / 11) * 0.8]);
      // no canto direito desce e emenda com o cordão da lateral
      for (let t = 0; t <= 1; t += 0.05) pts.push([fimX - 14 + 14 * Math.sin((t * Math.PI) / 2), base + (H - base + 2) * t * t]);
      const camadas = { frente: [], tras: [] };
      const cores = ["#7fb84f", "#94c95e", "#a9d871", "#c0e68e", "#d6efab", "#6ea845"];
      const folha = "M0 0 C2 -6 10 -8 14 -4 C16 -2 17 0 19 1 C16 3 13 7 8 7 C3 6 1 4 0 0 Z";
      let fio = { frente: [], tras: [] }, lado = null, atual = null, grupo = "", grupoLado = null, folhas = 0;
      const fecharGrupo = () => { if (grupo) { camadas[grupoLado].push(`<g class="grupo" style="animation-delay:-${(folhas % 9) * 0.45}s">${grupo}</g>`); grupo = ""; } };
      pts.forEach(([px, py], i) => {
        const prox = pts[Math.min(i + 1, pts.length - 1)];
        const l = prox[1] >= py ? "frente" : "tras";                     // descendo = na frente das palavras
        if (l !== lado) { atual = []; fio[l].push(atual); if (atual.length === 0 && i > 0) atual.push(`${pts[i - 1][0].toFixed(1)} ${pts[i - 1][1].toFixed(1)}`); lado = l; }
        atual.push(`${px.toFixed(1)} ${py.toFixed(1)}`);
        if (i % 2 === 0) {
          folhas++;
          if (l !== grupoLado || folhas % 6 === 0) { fecharGrupo(); grupoLado = l; }
          const ang = (folhas % 2 ? -45 : 135) + ((folhas * 29) % 70);
          const tam = 0.28 + ((folhas * 37) % 26) / 100;
          grupo += `<path d="${folha}" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${ang}) scale(${tam.toFixed(2)})" fill="${cores[folhas % cores.length]}"/>`;
        }
        if (i % 9 === 4) {
          grupo += `<g class="luz" style="animation-delay:-${((i * 0.37) % 3).toFixed(2)}s;animation-duration:${(1.8 + (i % 5) * 0.45).toFixed(2)}s">
            <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="9" fill="url(#halo-topo)"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="1.9" fill="#fffbe3"/></g>`;
        }
      });
      fecharGrupo();
      const defs = `<defs><radialGradient id="halo-topo"><stop offset="0" stop-color="#fff1a8"/><stop offset=".28" stop-color="#ffd76a" stop-opacity=".75"/><stop offset="1" stop-color="#ffc94a" stop-opacity="0"/></radialGradient></defs>`;
      for (const [svg, l] of [[tras, "tras"], [frente, "frente"]]) {
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        const linhas = fio[l].map((t) => `<path d="M${t.join(" L")}" fill="none" stroke="#9c8a62" stroke-width=".9"/>`).join("");
        svg.innerHTML = (l === "tras" ? defs : "") + linhas + camadas[l].join("");
      }
    }
    desenharCordaoTopo();
    window.addEventListener("load", desenharCordaoTopo);
    if (document.fonts) document.fonts.ready.then(desenharCordaoTopo);
    let esperaTopo;
    window.addEventListener("resize", () => { clearTimeout(esperaTopo); esperaTopo = setTimeout(desenharCordaoTopo, 200); });

    /* ---------- LED neon do Sobre mim: coração no canto superior direito, fio até o canto inferior esquerdo ---------- */
    function desenharNeonSobre() {
      const sec = $("#sobre"), svg = $("#neonSobre");
      if (!sec || !svg) return;
      const W = sec.offsetWidth, H = sec.offsetHeight;
      if (!W || !H) return;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const s = Math.max(70, Math.min(130, W * 0.085));          // tamanho do coração
      const cx = W - Math.max(70, W * 0.08) - s * 0.75, topo = Math.max(110, H * 0.12);
      const f = (n) => n.toFixed(1);
      // coração: ponta embaixo, duas curvas em cima
      const ponta = [cx, topo + s * 1.35];
      const coracao = `M${f(ponta[0])} ${f(ponta[1])} C${f(cx - s * .75)} ${f(topo + s * .8)} ${f(cx - s * 1.1)} ${f(topo + s * .25)} ${f(cx - s * .75)} ${f(topo - s * .1)}
        C${f(cx - s * .45)} ${f(topo - s * .42)} ${f(cx)} ${f(topo - s * .22)} ${f(cx)} ${f(topo + s * .15)}
        C${f(cx)} ${f(topo - s * .22)} ${f(cx + s * .45)} ${f(topo - s * .42)} ${f(cx + s * .75)} ${f(topo - s * .1)}
        C${f(cx + s * 1.1)} ${f(topo + s * .25)} ${f(cx + s * .75)} ${f(topo + s * .8)} ${f(ponta[0])} ${f(ponta[1])}`;
      // fio: sai da ponta do coração, passa pelo meio (atrás do texto) e termina no canto inferior esquerdo
      const fio = `M${f(ponta[0])} ${f(ponta[1])}
        C${f(ponta[0] - W * .02)} ${f(H * .38)} ${f(W * .68)} ${f(H * .36)} ${f(W * .56)} ${f(H * .5)}
        C${f(W * .46)} ${f(H * .62)} ${f(W * .34)} ${f(H * .54)} ${f(W * .26)} ${f(H * .68)}
        C${f(W * .18)} ${f(H * .82)} ${f(W * .1)} ${f(H * .9)} -12 ${f(H + 6)}`;
      svg.innerHTML = `<g class="neon-fio"><path class="tubo" d="${fio}"/><path class="nucleo" d="${fio}"/></g>
        <g class="neon-coracao-g"><path class="tubo" d="${coracao}"/><path class="nucleo" d="${coracao}"/></g>`;
    }
    desenharNeonSobre();
    window.addEventListener("load", desenharNeonSobre);
    if (document.fonts) document.fonts.ready.then(desenharNeonSobre);
    let esperaNeon;
    window.addEventListener("resize", () => { clearTimeout(esperaNeon); esperaNeon = setTimeout(desenharNeonSobre, 200); });
  </script>
</body>
