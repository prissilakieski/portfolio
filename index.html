<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prissila Kieski | Criadora de Conteúdo UGC</title>
  <meta name="description" content="Prissila Kieski, criadora de conteúdo UGC. Vídeos autênticos que vendem para marcas de beleza, casa, comida, moda e fitness.">
  <meta name="theme-color" content="#1f1b1e">

  <!-- Fontes do Google: Bodoni Moda (títulos, estilo editorial) e Archivo (corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       CORES E MEDIDAS DO SITE (troque aqui para mudar o visual)
       Estilo: editorial vintage, base grafite (preto suave),
       rosa milk, verde sálvia e rosa neon
       ========================================================== */
    :root {
      --fundo: #1f1b1e;            /* preto suave, puxado para o grafite */
      --fundo-2: rgba(44, 38, 42, .55);  /* seções alternadas, translúcidas (deixa as ilustrações aparecerem) */
      --superficie: #2a2528;       /* cards */
      --superficie-2: #342e32;
      --texto: #f6eef1;            /* texto principal (quase branco, leitura máxima) */
      --texto-suave: #cbbfc5;      /* texto de apoio */
      --escuro: #1f1b1e;           /* texto escuro sobre rosa milk */
      --milk: #f7dde4;             /* rosa milk: destaques, faixas e botões */
      --milk-forte: #eec1cd;
      --neon: #ff2d95;             /* rosa neon: brilho e detalhes */
      --neon-texto: #ff5cad;       /* rosa neon para TEXTO (contraste alto sobre o grafite) */
      --brilho: 0 0 10px rgba(255, 45, 149, .7), 0 0 28px rgba(255, 45, 149, .45);
      --salvia: #b3c4ae;           /* verde sálvia para textos e detalhes */
      --salvia-linha: #6f8a6c;     /* verde sálvia para linhas */
      --salvia-fundo: rgba(169, 187, 165, .12);
      --borda: rgba(255, 255, 255, .1);
      --titulo: "Bodoni Moda", "Didot", "Times New Roman", serif;
      --corpo: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
      --largura: 1240px;
      --gutter: clamp(16px, 4vw, 40px);
      --header-h: 72px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: clip; background: var(--fundo); }
    body {
      margin: 0;
      position: relative;
      background: transparent;
      color: var(--texto);
      font-family: var(--corpo);
      font-size: 1rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 400; }
    p { margin: 0; }
    ul { margin: 0; padding: 0; list-style: none; }
    button, input, textarea { font: inherit; color: inherit; }
    ::selection { background: var(--milk); color: var(--escuro); }

    :focus-visible { outline: 2px solid var(--neon-texto); outline-offset: 3px; }


    /* ==========================================================
       ILUSTRAÇÕES VINTAGE
       Arranjos montados com gravuras botânicas antigas em domínio público
       (via Wikimedia Commons): rosas e peônia de Pierre-Joseph Redouté,
       borboletas de Maria Sibylla Merian, papagaio de Jacques Barraband e
       beija-flores de John Gould. Arquivos na pasta "decoracao".
       Para deixar mais forte ou mais suave, mude o "opacity" (0 = invisível, 1 = total).
       ========================================================== */
    /* Buquê da capa em 3 camadas, cada uma balança num ritmo (efeito de brisa) */
    .capa-buque {
      position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;
      width: min(60vw, 880px); aspect-ratio: 1000 / 1100; opacity: .6;
      -webkit-mask-image: radial-gradient(ellipse 100% 100% at 0% 0%, #000 52%, transparent 100%);
              mask-image: radial-gradient(ellipse 100% 100% at 0% 0%, #000 52%, transparent 100%);
    }
    .capa-buque img { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 0 0; animation: brisa 12s ease-in-out infinite; }
    .capa-buque img:nth-child(2) { animation: brisa-b 9s ease-in-out -2s infinite; }
    .capa-buque img:nth-child(3) { animation-duration: 10s; animation-delay: -5s; }
    .capa > .container, .capa > .faixa-marcas { position: relative; z-index: 1; }
    .capa .selo, .capa h1, .capa .frase, .capa-numeros { text-shadow: 0 2px 26px rgba(20, 17, 19, .9), 0 0 2px rgba(20, 17, 19, .6); }


    /* Guirlandas: uma pintura contínua de flores que desce pelas laterais da página inteira,
       sem começo nem fim (a imagem foi montada para se repetir sem emenda) */
    .guirlanda { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .guirlanda span {
      position: absolute; top: 0; bottom: 0; width: min(30vw, 470px);
      background-repeat: repeat-y; background-size: 100% auto; opacity: .42;
    }
    .guirlanda .lado-esq {
      left: -8px; background-image: url("decoracao/guirlanda-esq.png");
      -webkit-mask-image: linear-gradient(to right, #000 45%, transparent); mask-image: linear-gradient(to right, #000 45%, transparent);
      animation: balanco-esq 10s ease-in-out infinite;
    }
    .guirlanda .lado-dir {
      right: -8px; background-image: url("decoracao/guirlanda-dir.png"); background-position: right 0 top 600px;
      -webkit-mask-image: linear-gradient(to left, #000 45%, transparent); mask-image: linear-gradient(to left, #000 45%, transparent);
      animation: balanco-dir 12s ease-in-out -4s infinite;
    }
    @keyframes balanco-esq { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
    @keyframes balanco-dir { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-7px); } }

    /* A brisa: balanço lento e bem pequeno, ancorado no canto de onde as flores "nascem" */    @keyframes brisa {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      30% { transform: rotate(.9deg) translate(2px, 1px); }
      65% { transform: rotate(-.6deg) translate(-1px, 2px); }
    }
    @keyframes brisa-b {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-1deg) translate(-2px, 1px); }
      80% { transform: rotate(.5deg); }
    }

    @media (max-width: 820px) {
      .capa-buque { width: 96vw; opacity: .42; }
      .guirlanda span { width: 38vw; opacity: .26; }
    }

    .pular {
      position: absolute; left: 16px; top: -100px; z-index: 200;
      background: var(--milk); color: var(--escuro); padding: 10px 16px;
      font-weight: 600; text-decoration: none;
    }
    .pular:focus { top: 12px; }

    .container { width: 100%; max-width: var(--largura); margin-inline: auto; padding-inline: var(--gutter); }

    section { scroll-margin-top: var(--header-h); }
    .secao { padding-block: clamp(72px, 11vw, 140px); position: relative; }

    .kicker {
      display: inline-block;
      background: var(--salvia-fundo); color: var(--salvia); border: 1px solid var(--salvia-linha);
      font-weight: 600; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase;
      padding: 6px 12px 5px; margin-bottom: 20px;
    }
    .titulo-secao {
      font-family: var(--titulo); font-size: clamp(2.4rem, 6.2vw, 4.6rem);
      line-height: 1.02; letter-spacing: -0.01em;
      transition: color .3s ease, text-shadow .3s ease;
    }
    .titulo-secao:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .sub-secao { color: var(--texto-suave); max-width: 600px; margin-top: 18px; font-size: 1.05rem; }
    .cabecalho-secao { margin-bottom: clamp(36px, 6vw, 64px); }

    /* ---------- Botões ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 14px 30px; border-radius: 0; border: 1px solid var(--milk);
      font-weight: 600; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
      transition: color .3s ease, background-color .3s ease, border-color .3s ease, text-shadow .3s ease, box-shadow .3s ease;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; fill: currentColor; }
    .btn-vermelho { background: var(--milk); color: var(--escuro); }
    .btn-vermelho:hover, .btn-vermelho:focus-visible {
      background: var(--neon); border-color: var(--neon); color: #fff;
      box-shadow: 0 0 26px rgba(255, 45, 149, .55);
    }
    .btn-cinza { background: transparent; color: var(--texto); border-color: rgba(255,255,255,.35); }
    .btn-cinza:hover, .btn-cinza:focus-visible { color: var(--neon-texto); border-color: var(--neon); text-shadow: var(--brilho); }

    /* ---------- Blocos de imagem em gradiente ---------- */
    .midia { position: relative; overflow: hidden; width: 100%; height: 100%; background-color: var(--superficie-2); background-size: cover; background-position: center; }
    img.midia { object-fit: cover; }

    /* ==========================================================
       1. CAPA
       ========================================================== */
    .topo {
      position: fixed; inset: 0 0 auto 0; z-index: 100; height: var(--header-h);
      background: rgba(31, 27, 30, .6);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: background-color .3s ease, box-shadow .3s ease;
    }
    .topo.rolado { background-color: rgba(31, 27, 30, .94); box-shadow: 0 1px 0 var(--borda); }
    .topo .container { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo {
      font-family: var(--titulo); font-size: 1.55rem; font-weight: 500; letter-spacing: .06em;
      color: var(--texto); text-decoration: none; text-transform: uppercase; line-height: 1; white-space: nowrap;
      transition: color .3s ease, text-shadow .3s ease;
    }
    .logo:hover, .logo:focus-visible { color: var(--neon-texto); text-shadow: var(--brilho); }
    .menu { display: flex; gap: 2px; }
    .menu a {
      display: block; padding: 8px 11px; text-decoration: none;
      font-weight: 500; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      color: var(--texto); transition: color .3s ease, text-shadow .3s ease;
    }
    .menu a:hover, .menu a:focus-visible { color: var(--neon-texto); text-shadow: var(--brilho); }
    .menu a.ativo { color: var(--milk); }
    .btn-menu { display: none; width: 46px; height: 46px; border: 0; background: transparent; cursor: pointer; position: relative; }
    .btn-menu span, .btn-menu span::before, .btn-menu span::after {
      position: absolute; left: 11px; width: 24px; height: 1.5px; background: var(--texto);
      transition: transform .25s ease, background-color .25s ease;
    }
    .btn-menu span { top: 22px; }
    .btn-menu span::before { content: ""; left: 0; top: -8px; }
    .btn-menu span::after { content: ""; left: 0; top: 8px; }
    .btn-menu[aria-expanded="true"] span { background: transparent; }
    .btn-menu[aria-expanded="true"] span::before { transform: translateY(8px) rotate(45deg); }
    .btn-menu[aria-expanded="true"] span::after { transform: translateY(-8px) rotate(-45deg); }

    .capa {
      position: relative; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding-top: calc(var(--header-h) + 36px);
      background:
        radial-gradient(ellipse 50% 50% at 80% 40%, rgba(247, 221, 228, .10), transparent 70%),
        radial-gradient(ellipse 40% 40% at 5% 95%, rgba(169, 187, 165, .10), transparent 70%);
      overflow: hidden;
    }
    .capa-grade {
      display: block; padding-bottom: clamp(40px, 6vw, 72px);
    }
    .selo {
      display: inline-flex; align-items: center; gap: 12px; margin-bottom: 22px;
      font-weight: 500; font-size: .76rem; letter-spacing: .26em; text-transform: uppercase; color: var(--salvia);
    }
    .selo b { font-weight: 700; color: var(--escuro); background: var(--milk); padding: 5px 10px 4px; letter-spacing: .22em; font-size: .74rem; }
    .capa h1 {
      font-family: var(--titulo); text-transform: uppercase; font-weight: 500;
      font-size: clamp(3.3rem, 10.5vw, 9rem); line-height: .9; letter-spacing: -0.015em;
    }
    .capa h1 span { transition: color .35s ease, text-shadow .35s ease; }
    .capa h1 span:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .capa h1 .linha-2 { display: inline-block; font-style: italic; font-weight: 400; color: var(--milk); padding-right: .08em; }
    .capa .frase { margin-top: 28px; max-width: 540px; font-size: clamp(1.05rem, 2vw, 1.22rem); color: var(--texto-suave); line-height: 1.7; }
    .capa .frase strong { color: var(--milk); font-weight: 600; font-style: italic; transition: color .3s ease, text-shadow .3s ease; }
    .capa .frase strong:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .capa .frase .local { color: var(--salvia); white-space: nowrap; }
    .capa-botoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    .capa-numeros {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
      margin-top: 48px; max-width: 560px; border-top: 1px solid var(--borda); padding-top: 24px;
    }
    .capa-numeros strong {
      display: block; font-family: var(--titulo); font-weight: 500; color: var(--milk);
      font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.05; transition: color .3s ease, text-shadow .3s ease;
    }
    .capa-numeros li:hover strong { color: var(--neon-texto); text-shadow: var(--brilho); }
    .capa-numeros span { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--texto-suave); }

    /* Foto da capa integrada: ocupa o lado direito e se funde com o fundo pelas bordas */
    .capa-texto { max-width: min(640px, 54%); }
    .capa-foto {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 0; width: min(62vw, 1060px); pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 40%), linear-gradient(to top, transparent 0%, #000 30%);
      -webkit-mask-composite: source-in; mask-composite: intersect;
      mask-image: linear-gradient(to right, transparent 0%, #000 40%), linear-gradient(to top, transparent 0%, #000 30%);
    }
    .capa-foto .midia { width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; filter: saturate(.95); }
    .capa-foto .iniciais {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 2;
      font-family: var(--titulo); font-style: italic; font-size: clamp(6rem, 16vw, 11rem); color: rgba(255,255,255,.5); pointer-events: none;
    }
    .faixa-marcas { background: var(--milk); overflow: hidden; position: relative; }
    .faixa-marcas .rotulo {
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; padding: 0 22px 0 var(--gutter);
      background: linear-gradient(90deg, var(--milk) 78%, transparent);
      font-size: .68rem; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--escuro);
    }
    .faixa-trilho { display: flex; width: max-content; animation: deslizar 42s linear infinite; }
    .faixa-marcas:hover .faixa-trilho { animation-play-state: paused; }
    .faixa-trilho ul { display: flex; }
    .faixa-trilho li {
      padding: 18px 30px; white-space: nowrap;
      font-family: var(--titulo); font-style: italic; font-size: 1.35rem; color: var(--escuro);
      display: flex; align-items: center; gap: 30px; transition: color .3s ease;
    }
    .faixa-trilho li:hover { color: #b1005d; }
    .faixa-trilho li::after { content: ""; width: 5px; height: 5px; background: var(--salvia-linha); border-radius: 50%; }
    .faixa-trilho li:nth-child(even)::after { background: var(--neon); }
    @keyframes deslizar { to { transform: translateX(-50%); } }

    /* ==========================================================
       2. SOBRE MIM
       ========================================================== */
    .sobre-grade { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: clamp(36px, 7vw, 96px); align-items: center; }
    .sobre-foto { aspect-ratio: 4 / 5; overflow: hidden; position: relative; }
    .sobre-texto p { color: var(--texto-suave); font-size: 1.06rem; margin-top: 16px; }
    .sobre-texto p:first-of-type { margin-top: 24px; }
    .entregas { margin-top: 30px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--borda); }
    .entregas li {
      padding: 14px 10px 14px 0; border-bottom: 1px solid var(--borda);
      display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: .95rem;
      transition: color .3s ease, text-shadow .3s ease;
    }
    .entregas li:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .entregas svg { width: 18px; height: 18px; color: var(--salvia); flex-shrink: 0; margin-top: 3px; }

    /* ==========================================================
       3. CONTEÚDOS DE DESTAQUE
       ========================================================== */
    .destaques-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 3vw, 36px); }
    .destaque {
      display: block; text-decoration: none; color: inherit;
      background: var(--superficie); overflow: hidden; position: relative; border: 1px solid var(--borda);
      transition: transform .4s ease, box-shadow .4s ease, border-color .4s ease;
    }
    .destaque:hover, .destaque:focus-visible {
      transform: translateY(-6px); border-color: var(--neon);
      box-shadow: 0 0 0 1px var(--neon), 0 24px 50px rgba(255, 45, 149, .22);
    }
    .destaque-capa { aspect-ratio: 9 / 16; position: relative; overflow: hidden; }
    .destaque-capa .midia { transition: transform .7s ease; }
    .destaque:hover .destaque-capa .midia { transform: scale(1.05); }
    .ranking {
      position: absolute; top: 8px; left: 16px; z-index: 2;
      font-family: var(--titulo); font-style: italic; font-size: 4.2rem; line-height: 1; color: #fff;
      text-shadow: 0 2px 14px rgba(0,0,0,.35);
    }
    .tag-alta {
      position: absolute; top: 16px; right: 16px; z-index: 2;
      background: var(--milk); color: var(--escuro); font-size: .64rem; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; padding: 6px 10px 5px;
    }
    .play {
      position: absolute; left: 50%; top: 50%; z-index: 2;
      width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
      background: rgba(31, 27, 30, .55); border: 1px solid var(--milk);
      display: grid; place-items: center; backdrop-filter: blur(4px);
      transition: background-color .3s ease, transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .play svg { width: 26px; height: 26px; margin-left: 4px; fill: var(--milk); transition: fill .3s ease; }
    .destaque:hover .play, .destaque:focus-visible .play,
    .trabalho:hover .play-mini, .trabalho:focus-visible .play-mini {
      background: var(--neon); border-color: var(--neon); transform: scale(1.08); box-shadow: 0 0 26px rgba(255, 45, 149, .7);
    }
    .destaque:hover .play svg, .destaque:focus-visible .play svg,
    .trabalho:hover .play-mini svg, .trabalho:focus-visible .play-mini svg { fill: #fff; }
    .destaque-info { padding: 22px 22px 26px; }
    .destaque-numero {
      font-family: var(--titulo); font-weight: 500; font-size: clamp(2.4rem, 4.4vw, 3.3rem); line-height: 1; color: var(--milk);
      transition: color .3s ease, text-shadow .3s ease;
    }
    .destaque:hover .destaque-numero { color: var(--neon-texto); text-shadow: var(--brilho); }
    .destaque-rotulo {
      display: inline-block; margin-top: 10px; color: var(--salvia); border: 1px solid var(--salvia-linha);
      font-weight: 600; font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; padding: 4px 9px 3px;
    }
    .destaque-titulo { margin-top: 16px; font-family: var(--corpo); font-weight: 600; font-size: 1.08rem; line-height: 1.35; }
    .destaque-contexto { margin-top: 6px; color: var(--texto-suave); font-size: .94rem; }

    /* ==========================================================
       4. TRABALHOS POR NICHO (catálogo) e TIKTOK SHOP
       ========================================================== */
    .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
    .filtro {
      border: 1px solid rgba(255,255,255,.22); background: transparent; color: var(--texto);
      padding: 10px 18px; border-radius: 999px; cursor: pointer;
      font-weight: 500; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      transition: background-color .3s ease, border-color .3s ease, color .3s ease, text-shadow .3s ease;
    }
    .filtro:hover { border-color: var(--neon); color: var(--neon-texto); text-shadow: var(--brilho); }
    .filtro[aria-pressed="true"] { background: var(--milk); border-color: var(--milk); color: var(--escuro); text-shadow: none; }
    .filtro[aria-pressed="true"]:hover { background: var(--neon); border-color: var(--neon); color: #fff; box-shadow: 0 0 20px rgba(255,45,149,.5); }

    .filtro-tts { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; border-color: var(--milk); color: var(--milk); }
    .filtro-tts svg { width: 14px; height: 14px; fill: currentColor; }
    .filtros:has(+ .subfiltros:not([hidden])) { margin-bottom: 12px; }
    .subfiltros { align-items: center; padding: 12px 14px; background: var(--salvia-fundo); border: 1px solid var(--salvia-linha); }
    .subfiltros[hidden] { display: none; }
    .subfiltros-rotulo { font-size: .68rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--salvia); margin-right: 4px; }
    .filtro-sub { padding: 8px 14px; }

    .fileira { margin-bottom: 34px; }
    .fileira[hidden] { display: none; }
    .fileira-topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .fileira-titulo { font-family: var(--titulo); font-weight: 500; font-size: 1.7rem; line-height: 1.1; }
    .fileira-titulo small {
      font-family: var(--corpo); color: var(--texto-suave); font-weight: 500;
      font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; margin-left: 12px;
    }
    .fileira-nicho {
      display: block; width: fit-content; font-family: var(--corpo);
      font-size: .64rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase;
      color: var(--salvia); border: 1px solid var(--salvia-linha); padding: 3px 8px 2px; margin-bottom: 8px;
    }
    .setas { display: flex; gap: 8px; }
    .seta {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22);
      background: var(--superficie); color: var(--texto); cursor: pointer; display: grid; place-items: center;
      transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
    }
    .seta:hover { border-color: var(--neon); color: var(--neon-texto); box-shadow: 0 0 16px rgba(255,45,149,.45); }
    .seta svg { width: 18px; height: 18px; }
    .trilho {
      display: grid; grid-auto-flow: column; grid-auto-columns: clamp(150px, 21vw, 236px);
      gap: 18px; overflow-x: auto; overscroll-behavior-x: contain;
      padding: 26px 14px 30px; margin-inline: -14px;
      scroll-snap-type: x mandatory; scroll-padding-inline: 14px;
      scrollbar-width: thin; scrollbar-color: var(--salvia-linha) transparent;
    }
    .trilho::-webkit-scrollbar { height: 5px; }
    .trilho::-webkit-scrollbar-thumb { background: var(--salvia-linha); border-radius: 3px; }
    .catalogo.filtrado .trilho {
      grid-auto-flow: row; grid-auto-columns: auto;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); overflow: visible;
    }
    .catalogo.filtrado .setas { display: none; }

    .trabalho {
      scroll-snap-align: start; position: relative; display: block; aspect-ratio: 2 / 3; overflow: hidden;
      text-decoration: none; color: inherit; background: var(--superficie-2);
      transition: transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s ease;
    }
    .trabalho:hover, .trabalho:focus-visible {
      transform: scale(1.09); z-index: 3;
      box-shadow: 0 0 0 2px var(--neon), 0 18px 40px rgba(255, 45, 149, .32);
    }
    .trabalho .midia { position: absolute; inset: 0; }
    .trabalho img.midia { object-position: 50% 30%; }
    .trabalho-tag {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      font-size: .6rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
      color: var(--escuro); background: var(--milk); padding: 5px 8px 4px;
    }
    .trabalho-info {
      position: absolute; inset: auto 0 0 0; z-index: 2; padding: 44px 12px 12px; color: #fff;
      background: linear-gradient(0deg, rgba(20,17,19,.92) 0%, rgba(20,17,19,.6) 55%, transparent 100%);
    }
    .trabalho-info h4 { margin: 0; font-family: var(--titulo); font-weight: 500; font-size: 1.12rem; line-height: 1.2; transition: color .3s ease, text-shadow .3s ease; }
    .trabalho:hover .trabalho-info h4 { color: var(--neon-texto); text-shadow: var(--brilho); }
    .trabalho-info .formato { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.85); font-weight: 500; margin-top: 5px; }
    .trabalho-info .desc {
      font-size: .8rem; color: #fff; line-height: 1.4;
      max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s ease, opacity .35s ease, margin .35s ease;
    }
    .trabalho:hover .desc, .trabalho:focus-visible .desc { max-height: 90px; opacity: 1; margin-top: 8px; }
    .play-mini { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
    .play-mini svg { width: 20px; height: 20px; }

    /* TikTok Shop */
    .tts-topo { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(24px, 5vw, 64px); align-items: end; margin-bottom: clamp(20px, 4vw, 36px); }
    .tts-topo .cabecalho-secao { margin-bottom: 0; }
    .tts-selo {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;
      background: var(--milk); color: var(--escuro); padding: 6px 12px 5px;
      font-size: .7rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    }
    .tts-selo svg { width: 16px; height: 16px; fill: currentColor; }
    .tts-lista { display: grid; gap: 0; border-top: 1px solid var(--borda); }
    .tts-lista li {
      display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--borda);
      font-weight: 500; transition: color .3s ease, text-shadow .3s ease;
    }
    .tts-lista li:hover { color: var(--neon-texto); text-shadow: var(--brilho); }
    .tts-lista svg { width: 18px; height: 18px; color: var(--salvia); flex-shrink: 0; margin-top: 3px; }
    .tts-aviso { color: var(--texto-suave); font-size: .9rem; margin-top: 6px; }

    /* Janela do player de vídeo */
    .janela-video {
      width: fit-content; max-width: calc(100vw - 32px); max-height: calc(100vh - 24px);
      padding: 16px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); overflow: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .janela-video::backdrop { background: rgba(20, 17, 19, .82); backdrop-filter: blur(6px); }
    .janela-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .janela-topo h2 { font-family: var(--titulo); font-weight: 500; font-size: 1.45rem; max-width: 22ch; }
    .fechar-video {
      width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); cursor: pointer;
      background: transparent; color: var(--texto); font-size: 1.6rem; line-height: 1;
      transition: color .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .fechar-video:hover { color: var(--neon-texto); border-color: var(--neon); box-shadow: 0 0 16px rgba(255,45,149,.45); }
    /* Player: a altura acompanha a tela, então o vídeo aparece inteiro sem rolar */
    .moldura-video {
      height: min(calc(100vh - 130px), 640px); aspect-ratio: 9 / 16; width: auto;
      max-width: calc(100vw - 64px); margin-inline: auto; overflow: hidden; background: #000;
    }
    .moldura-video iframe { width: 100%; height: 100%; border: 0; display: block; }
    .aviso-local { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; }

    /* ==========================================================
       5. SERVIÇOS
       ========================================================== */
    .servicos-grade {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px; background: var(--borda); border: 1px solid var(--borda);
    }
    .servico { background: rgba(42, 37, 40, .92); padding: 34px 28px; position: relative; overflow: hidden; transition: background-color .4s ease; }
    .servico::before {
      content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 2px;
      background: var(--neon); box-shadow: 0 0 12px var(--neon);
      transform: scaleX(0); transform-origin: left; transition: transform .45s ease;
    }
    .servico:hover { background: var(--superficie-2); }
    .servico:hover::before { transform: scaleX(1); }
    .servico-num { font-family: var(--titulo); font-style: italic; font-size: 2.6rem; line-height: 1; color: var(--salvia-linha); }
    .servico h3 { font-family: var(--titulo); font-weight: 500; font-size: 1.7rem; margin-top: 16px; transition: color .3s ease, text-shadow .3s ease; }
    .servico:hover h3 { color: var(--neon-texto); text-shadow: var(--brilho); }
    .servico p { color: var(--texto-suave); margin-top: 10px; }
    .servico .inclui { margin-top: 16px; font-size: .7rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--milk); }

    /* ==========================================================
       6. NÚMEROS E DEPOIMENTOS
       ========================================================== */
    .contadores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--milk); border-bottom: 1px solid var(--borda); }
    .contador { text-align: center; padding: 38px 14px; }
    .contador + .contador { border-left: 1px solid var(--borda); }
    .contador strong {
      display: block; font-family: var(--titulo); font-weight: 500; color: var(--milk);
      font-size: clamp(2.6rem, 5.5vw, 4.2rem); line-height: 1; transition: color .3s ease, text-shadow .3s ease;
    }
    .contador:hover strong { color: var(--neon-texto); text-shadow: var(--brilho); }
    .contador span { display: block; margin-top: 12px; color: var(--texto-suave); font-weight: 500; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; }
    .subtitulo-bloco { font-family: var(--titulo); font-style: italic; font-weight: 400; font-size: 1.8rem; margin: 72px 0 24px; display: flex; align-items: center; gap: 16px; }
    .subtitulo-bloco::after { content: ""; flex: 1; height: 1px; background: var(--borda); }
    .resultados { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .resultado { padding: 28px; background: var(--superficie); border-top: 2px solid var(--salvia-linha); transition: box-shadow .3s ease, border-color .3s ease; }
    .resultado:hover { border-color: var(--neon); box-shadow: 0 16px 40px rgba(255, 45, 149, .18); }
    .resultado .nicho { font-size: .66rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--salvia); }
    .resultado strong { display: block; font-family: var(--titulo); font-weight: 500; font-size: 3rem; line-height: 1.1; margin-top: 10px; color: var(--milk); transition: color .3s ease, text-shadow .3s ease; }
    .resultado:hover strong { color: var(--neon-texto); text-shadow: var(--brilho); }
    .resultado .metrica { font-weight: 600; }
    .resultado p { color: var(--texto-suave); margin-top: 8px; font-size: .95rem; }
    .depoimentos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .depoimento {
      margin: 0; background: var(--superficie); border: 1px solid var(--borda);
      padding: 30px 26px; display: flex; flex-direction: column; gap: 18px;
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .depoimento:hover { border-color: var(--neon); box-shadow: 0 16px 40px rgba(255, 45, 149, .16); }
    .depoimento .aspas { font-family: var(--titulo); font-size: 4.4rem; line-height: .6; color: var(--salvia-linha); height: 28px; }
    .estrelas { color: var(--neon-texto); letter-spacing: 3px; font-size: .95rem; }
    .depoimento blockquote { margin: 0; color: var(--texto); font-size: 1.02rem; }
    .depoimento figcaption { margin-top: auto; display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      font-family: var(--titulo); font-style: italic; font-size: 1.05rem; color: var(--escuro); background: var(--milk);
    }
    .depoimento figcaption b { display: block; font-weight: 600; }
    .depoimento figcaption span { color: var(--texto-suave); font-size: .86rem; }

    /* ==========================================================
       7. CONTATO
       ========================================================== */
    .contato-caixa {
      position: relative; background: rgba(42, 37, 40, .94); border: 1px solid var(--borda); border-top: 2px solid var(--milk);
      padding: clamp(26px, 6vw, 72px);
      display: grid; grid-template-columns: 1fr 1fr; gap: clamp(30px, 6vw, 80px);
    }
    .form { display: grid; gap: 18px; }
    .campo label { display: block; font-weight: 600; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 8px; color: var(--milk); }
    .campo input, .campo textarea {
      width: 100%; background: var(--fundo); border: 1px solid transparent; border-bottom: 1px solid rgba(255,255,255,.4);
      border-radius: 0; padding: 14px; font-size: 1rem; color: var(--texto);
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .campo textarea { min-height: 140px; resize: vertical; }
    .campo input::placeholder, .campo textarea::placeholder { color: #9d9096; }
    .campo input:focus, .campo textarea:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 0 3px rgba(255,45,149,.3), 0 0 18px rgba(255,45,149,.25); }
    .form .btn { justify-self: start; }
    .aviso-form { display: none; background: rgba(46,160,67,.15); border: 1px solid rgba(108,192,138,.7); color: #d4f5dd; padding: 12px 14px; font-weight: 600; }
    .aviso-form.mostrar { display: block; }
    .contato-direto p { color: var(--texto-suave); margin-top: 16px; }
    .botoes-contato { display: grid; gap: 10px; margin-top: 28px; }
    .botao-contato {
      display: flex; align-items: center; gap: 14px; text-decoration: none;
      background: var(--fundo); border: 1px solid var(--borda); padding: 14px 16px;
      transition: border-color .3s ease, transform .3s ease, box-shadow .3s ease; min-width: 0;
    }
    .botao-contato:hover { border-color: var(--neon); transform: translateX(4px); box-shadow: 0 0 22px rgba(255,45,149,.3); }
    .botao-contato:hover b { color: var(--neon-texto); text-shadow: var(--brilho); }
    .botao-contato .icone { width: 44px; height: 44px; background: var(--milk); display: grid; place-items: center; flex-shrink: 0; transition: background-color .3s ease; }
    .botao-contato:hover .icone { background: var(--neon); }
    .botao-contato .icone svg { width: 20px; height: 20px; fill: var(--escuro); transition: fill .3s ease; }
    .botao-contato:hover .icone svg { fill: #fff; }
    .botao-contato b { display: block; font-weight: 600; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; transition: color .3s ease, text-shadow .3s ease; }
    .botao-contato span { color: var(--texto-suave); font-size: .92rem; overflow-wrap: anywhere; }
    .botao-contato > div { min-width: 0; }

    /* ==========================================================
       8. RODAPÉ
       ========================================================== */
    .rodape { border-top: 1px solid var(--borda); padding-block: 48px; background: transparent; }
    .rodape .container { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; }
    .rodape .logo { font-size: 1.4rem; }
    .redes { display: flex; flex-wrap: wrap; gap: 8px; }
    .redes a {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      padding: 9px 14px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
      font-weight: 500; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase;
      transition: border-color .3s ease, color .3s ease, text-shadow .3s ease;
    }
    .redes a:hover { border-color: var(--neon); color: var(--neon-texto); text-shadow: var(--brilho); }
    .redes svg { width: 15px; height: 15px; fill: currentColor; }
    .direitos { width: 100%; color: var(--texto-suave); font-size: .78rem; letter-spacing: .06em; }

    /* ---------- Animação de entrada ---------- */
    .revelar { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
    .revelar.visivel { opacity: 1; transform: none; }
    .destaque.revelar.visivel {
      transition: transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s ease, border-color .45s ease, opacity .9s ease;
      transition-delay: 0s !important;
    }
    .destaque.revelar.visivel:hover, .destaque.revelar.visivel:focus-visible { transform: translateY(-6px); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      .revelar { opacity: 1; transform: none; }
    }

    /* ==========================================================
       RESPONSIVO
       ========================================================== */
    @media (max-width: 1120px) {
      .btn-menu { display: block; }
      .menu {
        position: fixed; top: var(--header-h); left: 0; right: 0;
        flex-direction: column; gap: 0; padding: 8px var(--gutter) 24px;
        background: rgba(31, 27, 30, .98); border-bottom: 1px solid var(--borda);
        transform: translateY(-8px); opacity: 0; visibility: hidden;
        transition: opacity .25s ease, transform .25s ease, visibility .25s;
      }
      .menu.aberto { opacity: 1; transform: none; visibility: visible; }
      .menu a { padding: 16px 4px; font-size: .82rem; border-bottom: 1px solid var(--borda); }
    }

    @media (max-width: 980px) {
      .servicos-grade, .resultados, .depoimentos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .contadores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .contador:nth-child(3) { border-left: 0; }
      .contador:nth-child(n+3) { border-top: 1px solid var(--borda); }
      .contato-caixa { grid-template-columns: 1fr; }
      .tts-topo { grid-template-columns: 1fr; }
    }

    @media (max-width: 820px) {
      .capa-grade { padding-top: 40svh; }
      .capa-texto { max-width: 100%; }
      .capa-foto {
        width: 100%; bottom: auto; height: 66svh;
        -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 45%); mask-image: linear-gradient(to top, transparent 0%, #000 45%);
        -webkit-mask-composite: source-over; mask-composite: add;
      }
      .capa-foto .iniciais { font-size: 7rem; }
      .sobre-grade { grid-template-columns: 1fr; }
      .sobre-foto { aspect-ratio: 4 / 3; }
      .destaques-grade { grid-template-columns: 1fr; max-width: 380px; margin-inline: auto; }
    }

    @media (max-width: 600px) {
      .capa { justify-content: flex-start; }
      .capa-botoes .btn { flex: 1 1 100%; }
      .capa-numeros { gap: 8px; }
      .capa-numeros span { font-size: .62rem; letter-spacing: .1em; line-height: 1.4; display: block; }
      .entregas { grid-template-columns: 1fr; }
      .servicos-grade, .resultados, .depoimentos { grid-template-columns: 1fr; }
      .contador { padding: 26px 8px; }
      .setas { display: none; }
      .form .btn { justify-self: stretch; }
      .faixa-marcas .rotulo { display: none; }
      .fileira-titulo small { display: block; margin: 4px 0 0; }
    }
</style>
</head>
<body>
  <!-- GUIRLANDAS: pintura contínua de flores vintage descendo pelas laterais da página inteira -->
  <div class="guirlanda" aria-hidden="true"><span class="lado-esq"></span><span class="lado-dir"></span></div>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>


  <!-- MENU FIXO (preenchido pelo JavaScript a partir do CONFIG) -->
  <header class="topo" id="topo">
    <div class="container">
      <a class="logo" href="#inicio" id="logo"></a>
      <button class="btn-menu" id="btnMenu" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu"><span></span></button>
      <nav aria-label="Menu principal">
        <ul class="menu" id="menu"></ul>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <!-- 1. CAPA -->
    <section class="capa" id="inicio" aria-labelledby="titulo-capa">
      <div class="capa-buque" aria-hidden="true">
        <img src="decoracao/buque-capa-1.png" alt="">
        <img src="decoracao/buque-capa-2.png" alt="">
        <img src="decoracao/buque-capa-3.png" alt="">
      </div>
      <div class="capa-foto" id="capaFoto"></div>
      <div class="container capa-grade">
        <div class="capa-texto">
          <p class="selo revelar" id="capaSelo"></p>
          <h1 id="titulo-capa" class="revelar"></h1>
          <p class="frase revelar" id="capaFrase"></p>
          <div class="capa-botoes revelar" id="capaBotoes"></div>
          <ul class="capa-numeros revelar" id="capaNumeros"></ul>
        </div>
      </div>
      <div class="faixa-marcas" aria-label="Marcas com quem já trabalhei">
        <span class="rotulo">Já trabalhei com</span>
        <div class="faixa-trilho" id="faixaMarcas"></div>
      </div>
    </section>

    <!-- 2. SOBRE MIM -->
    <section class="secao" id="sobre" aria-labelledby="titulo-sobre">
      <div class="container sobre-grade">
        <div class="sobre-foto revelar" id="sobreFoto"></div>
        <div class="sobre-texto revelar" id="sobreTexto"></div>
      </div>
    </section>

    <!-- 3. CONTEÚDOS DE DESTAQUE -->
    <section class="secao" id="destaques" aria-labelledby="titulo-destaques">
      <div class="container">
        <div class="cabecalho-secao revelar" id="destaquesCabecalho"></div>
        <div class="destaques-grade" id="destaquesGrade"></div>
      </div>
    </section>

    <!-- TIKTOK SHOP: vídeos exclusivos para venda pelo carrinho do TikTok -->
    <section class="secao" id="tiktokshop" aria-labelledby="titulo-tiktokshop">
      <div class="container">
        <div class="tts-topo">
          <div class="cabecalho-secao revelar" id="ttsCabecalho"></div>
          <ul class="tts-lista revelar" id="ttsLista"></ul>
        </div>
        <div class="trilho revelar" id="ttsTrilho"></div>
      </div>
    </section>

    <!-- 4. TRABALHOS POR NICHO -->
    <section class="secao" id="trabalhos" aria-labelledby="titulo-trabalhos">
      <div class="container">
        <div class="cabecalho-secao revelar" id="trabalhosCabecalho"></div>
        <div class="filtros revelar" id="filtros" role="group" aria-label="Filtrar trabalhos por nicho"></div>
        <div class="filtros subfiltros" id="subfiltros" role="group" hidden></div>
        <div class="catalogo" id="catalogo" aria-live="polite"></div>
      </div>

      tiktok: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.8a5.8 5.8 0 1 0 5 5.6V9.1a7.4 7.4 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.3-1.6Z"/></svg>'
    };

    // Descobre o código do vídeo a partir de qualquer link do YouTube
    function idYoutube(link) {
      if (!link) return "";
      const achado = String(link).match(/(?:video\/|v=|shorts\/|youtu\.be\/|embed\/)([\w-]{11})/);
      return achado ? achado[1] : (/^[\w-]{11}$/.test(link) ? link : "");
    }

    // Cria a imagem real (se houver) ou o bloco em gradiente no lugar
    function midia(item) {
      if (item.imagem) {
        return `<img class="midia" src="${esc(item.imagem)}" alt="${esc(item.alt || "")}" loading="lazy">`;
      }
      return `<div class="midia" role="img" aria-label="${esc(item.alt || "")}" style="background-image:${item.gradiente}"></div>`;
    }

    function cabecalho(dados, id) {
      return `<p class="kicker">${esc(dados.kicker)}</p>
        <h2 class="titulo-secao" id="${id}">${esc(dados.titulo)}</h2>
        ${dados.texto ? `<p class="sub-secao">${esc(dados.texto)}</p>` : ""}`;
    }

    const c = CONFIG.contato;
    const linkWhats = `https://wa.me/${c.whatsappLink}?text=${encodeURIComponent(c.whatsappMensagem)}`;
    const linkEmail = `mailto:${c.email}?subject=${encodeURIComponent("Parceria UGC para minha marca")}`;

    /* ---------- Menu ---------- */
    $("#logo").textContent = CONFIG.perfil.textoLogo;
    $("#logo").setAttribute("aria-label", `${CONFIG.perfil.textoLogo} de ${CONFIG.perfil.nome}, voltar ao início`);
    $("#menu").innerHTML = CONFIG.menu.map((m) => `<li><a href="${m.alvo}">${esc(m.texto)}</a></li>`).join("");

    /* ---------- 1. Capa ---------- */
    const cp = CONFIG.capa;
    $("#capaSelo").innerHTML = `<b>UGC</b> ${esc(CONFIG.perfil.profissao)}`;
    $("#titulo-capa").innerHTML = `<span>${esc(CONFIG.perfil.primeiroNome)}</span> <span class="linha-2">${esc(CONFIG.perfil.sobrenome)}</span>`;
    $("#capaFrase").innerHTML = cp.frase;
    $("#capaBotoes").innerHTML = `
      <a class="btn btn-vermelho" href="#contato">${icones.play} ${esc(cp.botaoPrincipal)}</a>
      <a class="btn btn-cinza" href="#trabalhos">${esc(cp.botaoSecundario)}</a>`;
    $("#capaNumeros").innerHTML = cp.numeros.map((n) => `<li><strong>${esc(n.valor)}</strong><span>${esc(n.rotulo)}</span></li>`).join("");
    $("#capaFoto").innerHTML = `${midia(cp)}${cp.imagem ? "" : `<span class="iniciais" aria-hidden="true">${esc(CONFIG.perfil.iniciais)}</span>`}`;

    // Faixa de marcas (a segunda cópia existe só para o movimento contínuo)
    const listaMarcas = CONFIG.marcas.map((m) => `<li>${esc(m)}</li>`).join("");
    $("#faixaMarcas").innerHTML = `<ul>${listaMarcas}</ul><ul aria-hidden="true">${listaMarcas}</ul>`;

    /* ---------- 2. Sobre ---------- */
    const sb = CONFIG.sobre;
    $("#sobreFoto").innerHTML = midia(sb);
    $("#sobreTexto").innerHTML = `${cabecalho({ kicker: sb.kicker, titulo: sb.titulo }, "titulo-sobre")}
      ${sb.paragrafos.map((p) => `<p>${esc(p)}</p>`).join("")}
      <ul class="entregas">${sb.entregas.map((e) => `<li>${icones.check}<span>${esc(e)}</span></li>`).join("")}</ul>`;

    /* ---------- 3. Destaques ---------- */
    const dt = CONFIG.destaques;
    $("#destaquesCabecalho").innerHTML = cabecalho(dt, "titulo-destaques");
    $("#destaquesGrade").innerHTML = dt.itens.map((d, i) => `
      <a class="destaque revelar" href="${esc(d.link)}" target="_blank" rel="noopener" style="transition-delay:${i * 0.12}s"
         aria-label="Assistir: ${esc(d.titulo)}. ${esc(d.numero)} ${esc(d.rotulo)}. Abre em nova aba.">
        <div class="destaque-capa">
          ${midia(d)}
          <span class="ranking" aria-hidden="true">${i + 1}</span>
          <span class="tag-alta" aria-hidden="true">Top ${i + 1}</span>
          <span class="play" aria-hidden="true">${icones.play}</span>
        </div>
        <div class="destaque-info">
          <p class="destaque-numero">${esc(d.numero)}</p>
          <span class="destaque-rotulo">${esc(d.rotulo)}</span>
          <h3 class="destaque-titulo">${esc(d.titulo)}</h3>
          <p class="destaque-contexto">${esc(d.contexto)}</p>
        </div>
      </a>`).join("");

    /* ---------- 4. Trabalhos ---------- */
    // Card de um trabalho (usado no catálogo e no TikTok Shop)
    function cardTrabalho(t) {
      const id = idYoutube(t.video);
      const capa = id && !t.imagem ? { ...t, imagem: `https://i.ytimg.com/vi/${id}/oardefault.jpg` } : t;
      const etiqueta = t.subcategoria || t.categoria || "";
      const atributos = id
        ? `href="https://www.youtube.com/watch?v=${id}" data-video="${id}" data-titulo="${esc(t.titulo)}" aria-label="Assistir vídeo: ${esc(t.titulo)}, ${esc(etiqueta)}, ${esc(t.formato)}. ${esc(t.descricao)}"`
        : `href="#contato" aria-label="${esc(t.titulo)}, ${esc(etiqueta)}, ${esc(t.formato)}. ${esc(t.descricao)}"`;
      return `
        <a class="trabalho${id ? " com-video" : ""}" ${atributos}>
          ${midia(capa)}
          ${id ? `<span class="play play-mini" aria-hidden="true">${icones.play}</span>` : ""}
          <span class="trabalho-tag" aria-hidden="true">${esc(etiqueta)}</span>
          <div class="trabalho-info" aria-hidden="true">
            <h4>${esc(t.titulo)}</h4>
            <p class="formato">${esc(t.formato)}</p>
            <p class="desc">${esc(t.descricao)}</p>
          </div>
        </a>`;
    }

    const tb = CONFIG.trabalhos;
    $("#trabalhosCabecalho").innerHTML = cabecalho(tb, "titulo-trabalhos");
    $("#filtros").innerHTML = ["Todos", ...tb.categorias]
      .map((cat, i) => `<button type="button" class="filtro" data-filtro="${esc(cat)}" aria-pressed="${i === 0}">${esc(cat)}</button>`).join("")
      + `<a class="filtro filtro-tts" href="#tiktokshop">${icones.carrinho} TikTok Shop</a>`;

    // Subnichos de cada nicho, na ordem em que aparecem na lista de trabalhos
    const subnichos = {};
    tb.categorias.forEach((cat) => {
      subnichos[cat] = [...new Set(tb.itens.filter((t) => t.categoria === cat && t.subcategoria).map((t) => t.subcategoria))];
    });

    // Uma fileira para cada subnicho (ou uma só para o nicho, se ele não tiver subnichos)
    const fileiras = [];
    tb.categorias.forEach((cat) => {
      const doNicho = tb.itens.filter((t) => t.categoria === cat);
      if (!doNicho.length) return;
      const semSub = doNicho.filter((t) => !t.subcategoria);
      subnichos[cat].forEach((sub) => fileiras.push({ cat, sub, itens: doNicho.filter((t) => t.subcategoria === sub) }));
      if (semSub.length) fileiras.push({ cat, sub: "", itens: semSub });
    });

    $("#catalogo").innerHTML = fileiras.map(({ cat, sub, itens }, idx) => {
      const idTrilho = `trilho-${idx}`;
      const nomeFileira = sub ? `${cat}: ${sub}` : cat;
      return `
        <div class="fileira revelar" data-categoria="${esc(cat)}" data-sub="${esc(sub)}">
          <div class="fileira-topo">
            <h3 class="fileira-titulo">${sub ? `<span class="fileira-nicho">${esc(cat)}</span>${esc(sub)}` : esc(cat)}<small>${itens.length} ${itens.length === 1 ? "trabalho" : "trabalhos"}</small></h3>
            <div class="setas">
              <button type="button" class="seta" data-trilho="${idTrilho}" data-dir="-1" aria-label="Ver trabalhos anteriores de ${esc(nomeFileira)}">${icones.esquerda}</button>
              <button type="button" class="seta" data-trilho="${idTrilho}" data-dir="1" aria-label="Ver mais trabalhos de ${esc(nomeFileira)}">${icones.direita}</button>
            </div>
          </div>
          <div class="trilho" id="${idTrilho}">
            ${itens.map(cardTrabalho).join("")}
          </div>
        </div>`;
    }).join("");

    // Filtros: primeiro o nicho; se ele tiver subnichos, aparece uma segunda linha de botões
    let nichoAtual = "Todos";
    function aplicarFiltro(nicho, sub) {
      nichoAtual = nicho;
      document.querySelectorAll("#filtros .filtro").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filtro === nicho)));
      document.querySelectorAll(".fileira").forEach((f) => {
        f.hidden = (nicho !== "Todos" && f.dataset.categoria !== nicho) || (sub && f.dataset.sub !== sub);
        f.classList.add("visivel");
      });
      $("#catalogo").classList.toggle("filtrado", nicho !== "Todos");

      const caixaSub = $("#subfiltros");
      const lista = nicho !== "Todos" ? subnichos[nicho] || [] : [];
      if (lista.length) {
        caixaSub.hidden = false;
        caixaSub.setAttribute("aria-label", `Filtrar ${nicho} por subnicho`);
        caixaSub.innerHTML = `<span class="subfiltros-rotulo">Subnicho:</span>` +
          [{ valor: "", texto: `Tudo de ${nicho}` }, ...lista.map((s) => ({ valor: s, texto: s }))]
            .map((o) => `<button type="button" class="filtro filtro-sub" data-sub="${esc(o.valor)}" aria-pressed="${o.valor === (sub || "")}">${esc(o.texto)}</button>`).join("");
      } else {
        caixaSub.hidden = true;
        caixaSub.innerHTML = "";
      }
    }
    $("#filtros").addEventListener("click", (e) => {
      const botao = e.target.closest("button.filtro");
      if (botao) aplicarFiltro(botao.dataset.filtro, "");
    });
    $("#subfiltros").addEventListener("click", (e) => {
      const botao = e.target.closest(".filtro-sub");
      if (botao) aplicarFiltro(nichoAtual, botao.dataset.sub);
    });

    /* ---------- Player de vídeo (janela que abre por cima do site) ---------- */
    const janela = $("#janelaVideo");
    const molduraVideo = $("#molduraVideo");
    function abrirVideo(id, titulo) {
      $("#tituloVideo").textContent = titulo;
      // O YouTube só libera o player quando o site está num endereço da internet (ou localhost).
      // Aberto com dois cliques (file://), mostramos um aviso no lugar do erro do YouTube.
      if (location.protocol === "file:") {
        molduraVideo.innerHTML = `<p class="aviso-local">O vídeo vai tocar aqui quando o site estiver publicado (GitHub Pages, Vercel ou Netlify). Aberto direto do computador, o YouTube bloqueia o player.</p>`;
        janela.showModal();
        return;
      }
      const origem = encodeURIComponent(location.origin);
      molduraVideo.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1&modestbranding=1&origin=${origem}"
        title="${esc(titulo)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      if (typeof janela.showModal === "function") janela.showModal();
      else window.open(`https://www.youtube.com/watch?v=${id}`, "_blank", "noopener");
    }
    janela.addEventListener("close", () => { molduraVideo.innerHTML = ""; });
    $("#fecharVideo").addEventListener("click", () => janela.close());
    janela.addEventListener("click", (e) => { if (e.target === janela) janela.close(); });

    /* ---------- TikTok Shop ---------- */
    const tts = CONFIG.tiktokShop;
    $("#ttsCabecalho").innerHTML = `<p class="tts-selo">${icones.carrinho} ${esc(tts.selo)}</p>
      <h2 class="titulo-secao" id="titulo-tiktokshop">${esc(tts.titulo)}</h2>
      <p class="sub-secao">${esc(tts.texto)}</p>`;
    $("#ttsLista").innerHTML = tts.diferenciais.map((d) => `<li>${icones.check}<span>${esc(d)}</span></li>`).join("");
    $("#ttsTrilho").innerHTML = tts.itens.map((t) => cardTrabalho({ categoria: tts.selo, ...t })).join("");

    // Cliques nos cards com vídeo (em qualquer parte do site) e nas setas das fileiras
    document.addEventListener("click", (e) => {
      const cardVideo = e.target.closest("[data-video]");
      if (cardVideo) {
        e.preventDefault();
        abrirVideo(cardVideo.dataset.video, cardVideo.dataset.titulo);
        return;
      }
      const seta = e.target.closest(".seta");
      if (!seta) return;
      const trilho = document.getElementById(seta.dataset.trilho);
      trilho.scrollBy({ left: Number(seta.dataset.dir) * trilho.clientWidth * 0.85, behavior: "smooth" });
    });

    /* ---------- 5. Serviços ---------- */
    const sv = CONFIG.servicos;
    $("#servicosCabecalho").innerHTML = cabecalho(sv, "titulo-servicos");
    $("#servicosGrade").innerHTML = sv.itens.map((s, i) => `
      <article class="servico revelar" style="transition-delay:${(i % 3) * 0.1}s">
        <span class="servico-num" aria-hidden="true">${String(i + 1).padStart(2, "0")}</span>
        <h3>${esc(s.titulo)}</h3>
        <p>${esc(s.descricao)}</p>
        <p class="inclui">${esc(s.inclui)}</p>
      </article>`).join("");

    /* ---------- 6. Números e depoimentos ---------- */
    const nm = CONFIG.numeros;
    $("#numerosCabecalho").innerHTML = cabecalho(nm, "titulo-numeros");
    const formatar = (v, casas) => v.toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
    $("#contadores").innerHTML = nm.contadores.map((n, i) => `
      <li class="contador revelar" style="transition-delay:${i * 0.1}s">
        <strong data-valor="${n.valor}" data-casas="${n.casas}" data-prefixo="${esc(n.prefixo)}" data-sufixo="${esc(n.sufixo)}"
          aria-label="${esc(n.prefixo + formatar(n.valor, n.casas) + n.sufixo)}">${esc(n.prefixo)}0${esc(n.sufixo)}</strong>
        <span>${esc(n.rotulo)}</span>
      </li>`).join("");
    $("#resultados").innerHTML = nm.resultados.map((r, i) => `
      <article class="resultado revelar" style="transition-delay:${i * 0.1}s">
        <span class="nicho">${esc(r.nicho)}</span>
        <strong>${esc(r.valor)}</strong>
        <span class="metrica">${esc(r.metrica)}</span>
        <p>${esc(r.texto)}</p>
      </article>`).join("");
    $("#depoimentos").innerHTML = nm.depoimentos.map((d, i) => `
      <figure class="depoimento revelar" style="transition-delay:${i * 0.1}s">
        <span class="aspas" aria-hidden="true">&ldquo;</span>
        <span class="estrelas" role="img" aria-label="Avaliação 5 de 5 estrelas">★★★★★</span>
        <blockquote>${esc(d.texto)}</blockquote>
        <figcaption>
          <span class="avatar" aria-hidden="true">${esc(d.nome.split(" ").map((p) => p[0]).slice(0, 2).join(""))}</span>
          <div><b>${esc(d.nome)}</b><span>${esc(d.empresa)}</span></div>
        </figcaption>
      </figure>`).join("");

    function animarContador(el) {
      const final = parseFloat(el.dataset.valor);
      const casas = parseInt(el.dataset.casas, 10);
      const { prefixo, sufixo } = el.dataset;
      const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduzir) { el.textContent = prefixo + formatar(final, casas) + sufixo; return; }
      const duracao = 1800;
      const inicio = performance.now();
      function passo(agora) {
        const p = Math.min((agora - inicio) / duracao, 1);
        const suave = 1 - Math.pow(1 - p, 3);
        el.textContent = prefixo + formatar(final * suave, casas) + sufixo;
        if (p < 1) requestAnimationFrame(passo);
      }
      requestAnimationFrame(passo);
    }

    /* ---------- 7. Contato ---------- */
    const ct = CONFIG.contatoSecao;
    $("#contatoDireto").innerHTML = `${cabecalho({ kicker: ct.kicker, titulo: ct.titulo }, "titulo-contato")}
      <p>${esc(ct.texto)}</p>
      <div class="botoes-contato">
        <a class="botao-contato" href="${linkWhats}" target="_blank" rel="noopener">
          <span class="icone">${icones.whatsapp}</span><div><b>WhatsApp</b><span>${esc(c.whatsapp)}</span></div>
        </a>
        <a class="botao-contato" href="mailto:${esc(c.email)}">
          <span class="icone">${icones.email}</span><div><b>E-mail</b><span>${esc(c.email)}</span></div>
        </a>
        <a class="botao-contato" href="${esc(c.instagram)}" target="_blank" rel="noopener">
          <span class="icone">${icones.instagram}</span><div><b>Instagram</b><span>${esc(c.usuario)}</span></div>
        </a>
      </div>`;

    $("#formContato").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const aviso = $("#avisoForm");
      const invalido = [...form.elements].find((el) => el.willValidate && !el.checkValidity());
      if (invalido) {
        aviso.style.cssText = "background:rgba(255,45,149,.12);border-color:#ff5cad;color:#ffd1e6";
        aviso.textContent = invalido.type === "email" && invalido.value
          ? "Confira o e-mail digitado, parece que falta alguma coisa."
          : "Preencha nome, e-mail e mensagem para eu poder te responder.";
        aviso.classList.add("mostrar");
        invalido.focus();
        return;
      }
      const nome = form.nome.value.trim();
      const assunto = `Proposta de parceria UGC: ${nome}`;
      const corpo = `Olá, Prissila!\n\n${form.mensagem.value.trim()}\n\nNome: ${nome}\nE-mail: ${form.email.value.trim()}`;
      window.location.href = `mailto:${c.email}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
      aviso.style.cssText = "";
      aviso.textContent = ct.mensagemSucesso;
      aviso.classList.add("mostrar");
      form.reset();
    });

    /* ---------- 8. Rodapé ---------- */
    $("#logoRodape").textContent = CONFIG.perfil.nome;
    $("#logoRodape").setAttribute("aria-label", `${CONFIG.perfil.nome}, voltar ao início`);
    $("#redesRodape").innerHTML = `
      <li><a href="${esc(c.instagram)}" target="_blank" rel="noopener">${icones.instagram} Instagram</a></li>
      <li><a href="${esc(c.tiktok)}" target="_blank" rel="noopener">${icones.tiktok} TikTok</a></li>
      <li><a href="${linkWhats}" target="_blank" rel="noopener">${icones.whatsapp} WhatsApp</a></li>
      <li><a href="mailto:${esc(c.email)}">${icones.email} E-mail</a></li>`;
    $("#direitos").textContent = `© ${new Date().getFullYear()} ${CONFIG.perfil.nome} · ${CONFIG.perfil.profissao}. ${CONFIG.rodape.frase}`;

    /* ---------- Menu: fundo ao rolar, sanduíche e link ativo ---------- */
    const topo = $("#topo");
    const btnMenu = $("#btnMenu");
    const menu = $("#menu");
    const aoRolar = () => topo.classList.toggle("rolado", window.scrollY > 40);
    window.addEventListener("scroll", aoRolar, { passive: true });
    aoRolar();

    function fecharMenu() {
      menu.classList.remove("aberto");
      btnMenu.setAttribute("aria-expanded", "false");
      btnMenu.setAttribute("aria-label", "Abrir menu");
    }
    btnMenu.addEventListener("click", () => {
      const abrir = btnMenu.getAttribute("aria-expanded") !== "true";
      menu.classList.toggle("aberto", abrir);
      btnMenu.setAttribute("aria-expanded", String(abrir));
      btnMenu.setAttribute("aria-label", abrir ? "Fechar menu" : "Abrir menu");
      if (abrir) menu.querySelector("a").focus();
    });
    menu.addEventListener("click", (e) => { if (e.target.closest("a")) fecharMenu(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && menu.classList.contains("aberto")) { fecharMenu(); btnMenu.focus(); }
    });
    window.addEventListener("resize", () => { if (window.innerWidth > 1120) fecharMenu(); });

    const linksMenu = [...menu.querySelectorAll("a")];
    const observadorSecoes = new IntersectionObserver((entradas) => {
      entradas.forEach((en) => {
        if (en.isIntersecting) {
          linksMenu.forEach((l) => {
            const ativo = l.getAttribute("href") === `#${en.target.id}`;
            l.classList.toggle("ativo", ativo);
            if (ativo) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current");
          });
        }
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    document.querySelectorAll("main section[id]").forEach((s) => observadorSecoes.observe(s));

    /* ---------- Animações de entrada ao rolar ---------- */
    const observadorRevelar = new IntersectionObserver((entradas, obs) => {
      entradas.forEach((en) => {
        if (!en.isIntersecting) return;
        en.target.classList.add("visivel");
        en.target.querySelectorAll?.("[data-valor]").forEach(animarContador);
        obs.unobserve(en.target);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".revelar").forEach((el) => observadorRevelar.observe(el));
  </script>
</body>
</html>
