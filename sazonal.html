<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sazonal | Prissila Kieski</title>
  <meta name="description" content="Vídeos sazonais de Prissila Kieski: campanhas de Natal e Black Friday.">
  <meta name="theme-color" content="#0f4d2c">

  <!-- Fontes do Google: Anton (títulos) e Archivo (corpo), as mesmas do portfólio -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Paleta de Natal americano: vermelho, verde e dourado */
    :root {
      --vermelho: #a50f1a;
      --vermelho-escuro: #7a0a12;
      --verde: #0f4d2c;
      --verde-claro: #1f7a3f;
      --dourado: #e6be5a;
      --dourado-claro: #f7dd8a;
      --dourado-escuro: #a97b1f;
      --creme: #fff8ec;
      --texto: #2a1a14;
      --texto-suave: #6b5446;
      --titulo: "Anton", "Impact", "Arial Narrow", sans-serif;
      --corpo: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
      --gutter: clamp(16px, 4vw, 40px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: clip; }
    body {
      margin: 0; color: var(--texto); font-family: var(--corpo); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: clip;
      /* xadrez vermelho (tartan) com listras verdes e fios dourados */
      background-color: var(--vermelho);
      background-image:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 28px, transparent 28px 56px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, .22) 0 28px, transparent 28px 56px),
        repeating-linear-gradient(0deg, transparent 0 11px, rgba(15, 77, 44, .6) 11px 16px, transparent 16px 56px),
        repeating-linear-gradient(90deg, transparent 0 11px, rgba(15, 77, 44, .6) 11px 16px, transparent 16px 56px),
        repeating-linear-gradient(0deg, transparent 0 40px, rgba(230, 190, 90, .55) 40px 41px, transparent 41px 56px),
        repeating-linear-gradient(90deg, transparent 0 40px, rgba(230, 190, 90, .55) 40px 41px, transparent 41px 56px);
      background-attachment: fixed;
    }
    a { color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 400; }
    p { margin: 0; }
    :focus-visible { outline: 2px solid var(--dourado); outline-offset: 3px; }
    .container { position: relative; z-index: 2; width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: var(--gutter); }

    /* Barra superior verde com detalhe dourado */
    .topo {
      position: sticky; top: 0; z-index: 60; height: 64px; background: var(--verde);
      border-bottom: 3px solid var(--dourado); box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
    .topo .container { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { font-family: var(--titulo); font-size: 1.45rem; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; color: var(--dourado-claro); }
    /* "Voltar ao portfólio": fácil de ler, dourado com texto verde escuro */
    .voltar {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 999px; text-decoration: none;
      font-family: var(--corpo); font-weight: 800; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--verde); background: linear-gradient(180deg, var(--dourado-claro), var(--dourado));
      border: 1px solid #fff3c4; box-shadow: 0 0 14px rgba(247, 221, 138, .55);
      transition: transform .45s cubic-bezier(.34, 1.7, .5, 1), box-shadow .3s ease;
    }
    .voltar:hover, .voltar:focus-visible { transform: translateY(-3px); box-shadow: 0 0 22px rgba(247, 221, 138, .95); }
    /* Fita dourada descendo pela lateral, com o laço no alto */
    .fita {
      position: fixed; top: 0; bottom: 0; left: clamp(60px, 7vw, 100px); width: clamp(16px, 2.4vw, 34px); z-index: 1; pointer-events: none;
      background-color: #b3121d;
      background-image:
        linear-gradient(90deg, var(--dourado) 0 2px, transparent 2px calc(100% - 2px), var(--dourado) calc(100% - 2px)),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, .28) 0 6px, transparent 6px 14px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, .28) 0 6px, transparent 6px 14px),
        repeating-linear-gradient(0deg, transparent 0 10px, #0f4d2c 10px 11px, transparent 11px 14px),
        repeating-linear-gradient(90deg, transparent 0 10px, #0f4d2c 10px 11px, transparent 11px 14px),
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(242, 207, 110, .9) 2px 2.6px, transparent 2.6px 14px);
      box-shadow: 0 0 14px rgba(0, 0, 0, .35);
    }
    .laco {
      position: fixed; top: 70px; left: calc(clamp(60px, 7vw, 100px) + clamp(16px, 2.4vw, 34px) / 2); z-index: 3; pointer-events: none;
      width: clamp(170px, 15vw, 230px); transform: translateX(-50%); filter: drop-shadow(0 12px 14px rgba(0, 0, 0, .45));
    }

    /* Painéis creme com borda dourada, como cartão de presente */
    .painel {
      position: relative; background: var(--creme); border-radius: 16px;
      border: 2px solid var(--dourado); outline: 1px solid var(--dourado-escuro); outline-offset: -8px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, .35);
      padding: clamp(26px, 5vw, 56px);
    }

    /* Abertura */
    .abertura { padding: clamp(40px, 7vw, 80px) 0 clamp(22px, 4vw, 36px); }
    .abertura .painel { text-align: center; }
    .kicker {
      display: inline-block; padding: 6px 14px 5px; margin-bottom: 16px; border-radius: 999px;
      font-weight: 700; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase;
      color: var(--creme); background: var(--verde); border: 1px solid var(--dourado);
    }
    .abertura h1 {
      font-family: var(--titulo); text-transform: uppercase; font-size: clamp(3.4rem, 12vw, 8rem); line-height: .9; letter-spacing: .02em;
      color: var(--vermelho);
      text-shadow: 3px 3px 0 var(--dourado), 6px 6px 0 rgba(15, 77, 44, .35);
    }
    .abertura p { color: var(--texto-suave); max-width: 560px; margin: 20px auto 0; font-size: 1.05rem; }
    .abertura .kicker { color: var(--creme); margin: 0 0 16px; max-width: none; font-size: .72rem; }
    .atalhos { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .atalho {
      padding: 11px 22px; border-radius: 999px; text-decoration: none;
      font-weight: 700; font-size: .74rem; letter-spacing: .18em; text-transform: uppercase; color: var(--creme);
      background: var(--vermelho); border: 2px solid var(--dourado);
      box-shadow: 0 8px 20px rgba(122, 10, 18, .35), 0 0 18px rgba(230, 190, 90, .45);
      transition: transform .45s cubic-bezier(.34, 1.7, .5, 1), background-color .3s ease, box-shadow .3s ease;
    }
    .atalho.preto { background: #0d0b0c; border-color: #e0102a; color: #fff; box-shadow: 0 8px 20px rgba(0, 0, 0, .4), 0 0 16px rgba(224, 16, 42, .55); }
    .atalho.preto:hover, .atalho.preto:focus-visible { background: #e0102a; border-color: #0d0b0c; box-shadow: 0 12px 26px rgba(0, 0, 0, .35), 0 0 24px rgba(224, 16, 42, .8); }
    .atalho:hover, .atalho:focus-visible { transform: translateY(-6px) scale(1.07); box-shadow: 0 12px 26px rgba(0, 0, 0, .3), 0 0 26px rgba(247, 221, 138, .9); }

    /* Campanhas */
    .campanha { padding: clamp(22px, 4vw, 40px) 0; scroll-margin-top: 72px; }
    .campanha h2 { font-family: var(--titulo); text-transform: uppercase; font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1; color: var(--verde); }
    .campanha h2 span { color: var(--vermelho); }
    .campanha .desc { color: var(--texto-suave); max-width: 560px; margin-top: 10px; }
    .selo-campanha {
      display: inline-block; margin-bottom: 12px; padding: 5px 12px 4px; border-radius: 999px;
      font-weight: 700; font-size: .66rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--vermelho-escuro); background: rgba(230, 190, 90, .3); border: 1px solid var(--dourado);
    }
    .campanha-topo { margin-bottom: 28px; }
    /* Black Friday: painel verde escuro com dourado */
    #black-friday .painel { background: linear-gradient(160deg, #0c3d23, #072615); color: var(--creme); }
    #black-friday h2 { color: var(--dourado-claro); text-shadow: 0 0 10px rgba(247, 221, 138, .55); }
    #black-friday h2 span { color: var(--creme); }
    #black-friday .desc { color: #d8e6d6; }
    #black-friday .selo-campanha { color: var(--verde); background: var(--dourado); }

    /* Vídeos 9:16 */
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 250px)); gap: 22px; padding-top: 10px; }
    .card {
      position: relative; display: block; aspect-ratio: 9 / 16; overflow: hidden; border-radius: 8px;
      text-decoration: none; color: #fff; background: #f1e3cc; border: 2px solid var(--dourado);
      transition: transform .5s cubic-bezier(.34, 1.6, .5, 1), box-shadow .4s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-12px) scale(1.05); z-index: 2;
      box-shadow: 0 0 0 2px var(--dourado-claro), 0 0 24px rgba(247, 221, 138, .9), 0 22px 40px rgba(0, 0, 0, .35);
    }
    .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
    .card .play {
      position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
      display: grid; place-items: center; background: rgba(255, 248, 236, .9); transition: background-color .3s ease, transform .3s ease;
    }
    .card .play svg { width: 22px; height: 22px; margin-left: 3px; fill: var(--vermelho); }
    .card:hover .play { background: var(--dourado-claro); transform: scale(1.08); }
    .card .info { position: absolute; inset: auto 0 0 0; padding: 44px 12px 12px; background: linear-gradient(0deg, rgba(40, 8, 10, .92), rgba(40, 8, 10, .55) 55%, transparent); }
    .card h3 { font-family: var(--titulo); font-size: 1.1rem; text-transform: uppercase; letter-spacing: .02em; transition: color .3s ease; }
    .card:hover h3 { color: var(--dourado-claro); }
    .card .marca { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: rgba(255, 255, 255, .85); margin-top: 4px; }

    /* Espaço reservado enquanto os vídeos não chegam */
    .vazio {
      display: grid; place-items: center; aspect-ratio: 9 / 16; border-radius: 8px; text-align: center; padding: 18px;
      border: 2px dashed var(--dourado); color: var(--texto-suave); background: rgba(230, 190, 90, .1);
      font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    }
    .vazio b { display: block; font-family: var(--titulo); font-weight: 400; font-size: 1.6rem; letter-spacing: .04em; color: var(--vermelho); margin-bottom: 6px; }
    .vazio i { display: block; font-style: normal; font-size: 1.8rem; margin-bottom: 6px; }
    #black-friday .vazio { color: #d8e6d6; background: rgba(230, 190, 90, .08); }
    #black-friday .vazio b { color: var(--dourado-claro); }

    /* Abertura de presente: tampa com fitas e laço que se abre ao carregar a página */
    .presente {
      position: fixed; inset: 0; z-index: 100; pointer-events: none; overflow: hidden;
    }
    .presente .tampa {
      position: absolute; inset: 0;
      background-color: var(--vermelho);
      background-image:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 28px, transparent 28px 56px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, .22) 0 28px, transparent 28px 56px),
        repeating-linear-gradient(0deg, transparent 0 11px, rgba(15, 77, 44, .6) 11px 16px, transparent 16px 56px),
        repeating-linear-gradient(90deg, transparent 0 11px, rgba(15, 77, 44, .6) 11px 16px, transparent 16px 56px);
      animation: tampa-sobe 1.1s cubic-bezier(.6, 0, .3, 1) 1.5s forwards;
    }
    .presente .fita-h, .presente .fita-v {
      position: absolute; background: linear-gradient(90deg, var(--dourado-escuro), var(--dourado-claro) 40%, var(--dourado) 60%, var(--dourado-escuro));
    }
    .presente .fita-v { top: 0; bottom: 0; left: 50%; width: 46px; margin-left: -23px; animation: fita-v-abre .7s ease-in .9s forwards; }
    .presente .fita-h {
      left: 0; right: 0; top: 50%; height: 46px; margin-top: -23px;
      background: linear-gradient(180deg, var(--dourado-escuro), var(--dourado-claro) 40%, var(--dourado) 60%, var(--dourado-escuro));
      animation: fita-h-abre .7s ease-in .9s forwards;
    }
    .presente .laco-grande { height: auto;
      position: absolute; left: 50%; top: 50%; width: min(380px, 70vw); transform: translate(-50%, -40%);
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, .4));
      animation: laco-desfaz .8s ease-in .5s forwards;
    }
    .presente .dica {
      position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; color: var(--creme);
      font-weight: 700; font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0, 0, 0, .5);
      animation: some .4s ease 1.2s forwards;
    }
    @keyframes laco-desfaz { to { transform: translate(-50%, -40%) scale(1.5) rotate(-12deg); opacity: 0; } }
    @keyframes fita-v-abre { to { transform: scaleY(0); opacity: 0; } }
    @keyframes fita-h-abre { to { transform: scaleX(0); opacity: 0; } }
    @keyframes tampa-sobe { to { transform: translateY(-105%); } }
    @keyframes some { to { opacity: 0; } }
    .presente.aberto { display: none; }

    /* Neve */
    .neve { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
    .floco {
      position: absolute; top: -12px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 6px rgba(255, 255, 255, .8);
      animation: cair linear infinite;
    }
    @keyframes cair {
      0% { transform: translate(0, -2vh); }
      50% { transform: translate(var(--deriva, 20px), 52vh); }
      100% { transform: translate(0, 106vh); }
    }

    /* Player */
    .janela { width: fit-content; max-width: calc(100vw - 32px); max-height: calc(100vh - 24px); padding: 16px; border: 2px solid var(--dourado); border-radius: 12px; background: var(--creme); overflow: auto; }
    .janela::backdrop { background: rgba(40, 8, 10, .75); backdrop-filter: blur(4px); }
    .janela-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .janela-topo h2 { font-family: var(--titulo); font-size: 1.35rem; text-transform: uppercase; max-width: 22ch; color: var(--verde); }
    .fechar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--dourado); background: var(--creme); cursor: pointer; font-size: 1.5rem; line-height: 1; color: var(--vermelho); }
    .fechar:hover { background: var(--dourado-claro); }
    .moldura { height: min(calc(100vh - 130px), 640px); aspect-ratio: 9 / 16; max-width: calc(100vw - 64px); margin-inline: auto; background: #000; }
    .moldura iframe { width: 100%; height: 100%; border: 0; display: block; }
    .aviso-local { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; }

    .rodape { position: relative; z-index: 2; padding: 30px 0 40px; text-align: center; color: var(--creme); font-size: .8rem; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }

    @media (max-width: 700px) {
      .container { padding-left: calc(var(--gutter) + 34px); }   /* espaço para a fita da lateral */
      .fita { left: 24px; width: 16px; }
      .laco { top: 66px; left: 32px; width: 64px; }
      .topo .container { padding-left: var(--gutter); }
      .logo { font-size: 1.2rem; }
      .voltar { padding: 6px 12px; font-size: .64rem; letter-spacing: .08em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      .presente, .neve { display: none; }
    }
  </style>
</head>
<body>
  <!-- Abertura: a página "abre" como uma caixa de presente -->
  <div class="presente" id="presente" aria-hidden="true">
    <div class="tampa">
      <div class="fita-v"></div>
      <div class="fita-h"></div>
      <svg class="laco-grande" viewBox="0 0 240 280"><use href="#desenho-laco"/></svg>
      <p class="dica">Abrindo seu presente</p>
    </div>
  </div>

  <!-- Desenho do laço (usado na abertura e na lateral) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fbe7a1"/><stop offset=".45" stop-color="#e6be5a"/><stop offset="1" stop-color="#a97b1f"/>
      </linearGradient>
      <!-- fita xadrez escocês vermelho com fios verdes e dourados -->
      <pattern id="xadrez" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
        <rect width="14" height="14" fill="#b3121d"/>
        <rect y="4" width="14" height="4" fill="#6e0a12" opacity=".75"/><rect x="4" width="4" height="14" fill="#6e0a12" opacity=".75"/>
        <rect y="11" width="14" height="1.1" fill="#0f4d2c"/><rect x="11" width="1.1" height="14" fill="#0f4d2c"/>
        <rect y="1.5" width="14" height=".55" fill="#f2cf6e" opacity=".9"/><rect x="1.5" width=".55" height="14" fill="#f2cf6e" opacity=".9"/>
      </pattern>
      <!-- fita de tela dourada (malha) -->
      <pattern id="tela-ouro" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="7" height="7" fill="#e6be5a" opacity=".5"/>
        <path d="M0 0 H7 M0 0 V7" stroke="#f2cf6e" stroke-width="1.9"/>
      </pattern>
      <!-- veludo vinho -->
      <radialGradient id="veludo" cx=".35" cy=".3" r=".85">
        <stop offset="0" stop-color="#c0222f"/><stop offset=".55" stop-color="#8a0d1a"/><stop offset="1" stop-color="#4f0610"/>
      </radialGradient>
      <linearGradient id="veludo-ponta" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#9b1220"/><stop offset="1" stop-color="#55070f"/>
      </linearGradient>
      <!-- o desenho do laço é montado pelo JavaScript (camadas de fitas, pinheiro e frutinhas) -->
      <g id="desenho-laco"></g>
    </defs>
  </svg>

  <div class="fita" aria-hidden="true"></div>
  <svg class="laco" viewBox="0 0 240 280" aria-hidden="true"><use href="#desenho-laco"/></svg>
  <div class="neve" id="neve" aria-hidden="true"></div>

  <header class="topo">
    <div class="container">
      <a class="logo" href="index.html">Portfólio</a>
      <a class="voltar" href="index.html">← Voltar ao portfólio</a>
    </div>
  </header>

  <main>
    <section class="abertura">
      <div class="container">
        <div class="painel">
          <p class="kicker">Campanhas sazonais</p>
          <h1>Sazonal</h1>
          <p>Vídeos pensados para as datas que mais vendem no ano, com o mesmo cuidado de sempre e o clima de cada campanha.</p>
          <nav class="atalhos" aria-label="Campanhas">
            <a class="atalho" href="#natal">Natal</a>
            <a class="atalho preto" href="#black-friday">Black Friday</a>
          </nav>
        </div>
      </div>
    </section>

    <section class="campanha" id="natal" aria-labelledby="titulo-natal">
      <div class="container">
        <div class="painel">
          <div class="campanha-topo">
            <span class="selo-campanha">Campanha de fim de ano</span>
            <h2 id="titulo-natal"><span>Natal</span></h2>
            <p class="desc" id="descNatal"></p>
          </div>
          <div class="grade" id="gradeNatal"></div>
        </div>
      </div>
    </section>

    <section class="campanha" id="black-friday" aria-labelledby="titulo-bf">
      <div class="container">
        <div class="painel">
          <div class="campanha-topo">
            <span class="selo-campanha">Oferta relâmpago</span>
            <h2 id="titulo-bf"><span>Black</span> Friday</h2>
            <p class="desc" id="descBF"></p>
          </div>
          <div class="grade" id="gradeBF"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape"><p id="direitos"></p></footer>

  <dialog class="janela" id="janela" aria-labelledby="tituloVideo">
    <div class="janela-topo">
      <h2 id="tituloVideo"></h2>
      <button type="button" class="fechar" id="fechar" aria-label="Fechar vídeo">&times;</button>
    </div>
    <div class="moldura" id="moldura"></div>
  </dialog>

  <script>
    /* =====================================================================
       EDITE AQUI: vídeos sazonais
       Para cada vídeo, copie uma linha de exemplo e preencha:
         titulo: nome do vídeo
         marca: marca da campanha (opcional)
         video: link do YouTube (Studio, watch, shorts ou youtu.be). Pode ser "Não listado".
       Enquanto a lista estiver vazia, aparecem espaços "Em breve".
       ===================================================================== */
    const SAZONAL = {
      natal: {
        texto: "Presentes, mesa posta, kits e aquele clima de fim de ano que faz o público querer comprar para quem ama.",
        itens: [
          // { titulo: "Kit presente de Natal", marca: "Nome da marca", video: "https://youtube.com/shorts/CODIGO" },
        ]
      },
      blackFriday: {
        texto: "Ofertas com urgência, preço em destaque e chamada direta para a compra: vídeos feitos para converter no dia que mais vende.",
        itens: [
          // { titulo: "Oferta de Black Friday", marca: "Nome da marca", video: "https://youtube.com/shorts/CODIGO" },
        ]
      }
    };

    /* ---------- daqui para baixo é o funcionamento (não precisa editar) ---------- */
    const $ = (s) => document.querySelector(s);

    /* ---------- Laço de Natal em camadas: tela dourada, pinheiro, veludo, xadrez e frutinhas ---------- */
    (function montarLaco() {
      const C = [120, 96];                                         // centro do laço
      const g = (pts) => pts.map((n) => n.toFixed(1)).join(" ");
      // laçada em formato de gota apontando para "ang" graus
      const lacada = (ang, comp, larg, fill, cor = "#3e050c") =>
        `<path d="M0 0 C${g([comp * .3, -larg])} ${g([comp * .95, -larg * 1.05])} ${g([comp, 0])} C${g([comp * .95, larg * 1.05])} ${g([comp * .3, larg])} 0 0 Z"
          transform="translate(${C[0]} ${C[1]}) rotate(${ang})" fill="${fill}" stroke="${cor}" stroke-width=".9"/>
         <path d="M${g([comp * .25, -larg * .35])} C${g([comp * .55, -larg * .75])} ${g([comp * .85, -larg * .6])} ${g([comp * .92, -larg * .15])}"
          transform="translate(${C[0]} ${C[1]}) rotate(${ang})" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="2"/>`;
      // ponta longa com corte em V
      const ponta = (ang, comp, larg, fill) =>
        `<path d="M0 ${-larg / 2} L${comp} ${-larg / 2} L${comp - larg * .7} 0 L${comp} ${larg / 2} L0 ${larg / 2} Z"
          transform="translate(${C[0]} ${C[1] + 6}) rotate(${ang})" fill="${fill}" stroke="#3e050c" stroke-width=".8"/>`;
      // raminho de pinheiro
      const pinheiro = (ang, comp) => {
        let s = `<path d="M0 0 L${comp} 0" stroke="#3f2a14" stroke-width="1.8"/>`;
        for (let x = 6; x < comp; x += 3) {
          const t = 10 * (1 - x / comp) + 4;
          s += `<path d="M${x} 0 l${t * .55} ${-t}" stroke="${x % 2 ? "#1f5a2e" : "#2f7a3f"}" stroke-width="1.6"/><path d="M${x} 0 l${t * .55} ${t}" stroke="${x % 2 ? "#2f7a3f" : "#1f5a2e"}" stroke-width="1.6"/>`;
        }
        return `<g transform="translate(${C[0]} ${C[1]}) rotate(${ang})" stroke-linecap="round">${s}</g>`;
      };
      // cacho de frutinhas vermelhas
      const frutinhas = (x, y, n) => {
        let s = "";
        for (let i = 0; i < n; i++) {
          const a = i * 2.4, r = 3 + (i % 3) * .7, d = 4 + i * 1.6;
          const bx = x + Math.cos(a) * d, by = y + Math.sin(a) * d * .8;
          s += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${r}" fill="#8e0c18" stroke="#4f0610" stroke-width=".6"/><circle cx="${(bx - r * .35).toFixed(1)}" cy="${(by - r * .35).toFixed(1)}" r="${(r * .3).toFixed(1)}" fill="#fff" opacity=".55"/>`;
        }
        return s;
      };
      let d = "";
      // fundo: tela dourada e pinheiro
      [-150, -30, 150, 30, -112, -68].forEach((a, i) => { d += lacada(a, i < 4 ? 96 : 72, i < 4 ? 24 : 18, "url(#tela-ouro)", "#c99a2e"); });
      [-125, -55, -92, 115, 65, 96, 172, 8, 145, 35, -160, -20].forEach((a, i) => { d += pinheiro(a, 104 + (i % 3) * 12); });
      // pontas: tela dourada, veludo e xadrez
      d += ponta(92, 150, 18, "url(#tela-ouro)");
      d += ponta(104, 160, 26, "url(#veludo-ponta)") + ponta(76, 160, 26, "url(#veludo-ponta)");
      d += ponta(122, 118, 22, "url(#xadrez)") + ponta(58, 118, 22, "url(#xadrez)");
      // laçadas de veludo e de xadrez
      d += lacada(-172, 104, 32, "url(#veludo)") + lacada(-8, 104, 32, "url(#veludo)");
      d += lacada(138, 82, 26, "url(#veludo)") + lacada(42, 82, 26, "url(#veludo)");
      d += lacada(-142, 84, 25, "url(#xadrez)") + lacada(-38, 84, 25, "url(#xadrez)");
      d += lacada(168, 70, 20, "url(#xadrez)") + lacada(12, 70, 20, "url(#xadrez)");
      // frutinhas e pinheiro por cima
      d += pinheiro(100, 58) + pinheiro(80, 52);
      d += frutinhas(96, 66, 7) + frutinhas(146, 68, 7) + frutinhas(98, 128, 8) + frutinhas(142, 130, 8) + frutinhas(116, 150, 9) + frutinhas(126, 172, 6);
      // nó de veludo
      d += `<rect x="${C[0] - 16}" y="${C[1] - 15}" width="32" height="30" rx="11" fill="url(#veludo)" stroke="#3e050c" stroke-width="1"/>
            <path d="M${C[0] - 9} ${C[1] - 8} Q${C[0]} ${C[1] - 13} ${C[0] + 9} ${C[1] - 8}" fill="none" stroke="#ffd9dd" stroke-width="2" stroke-linecap="round" opacity=".45"/>`;
      document.getElementById("desenho-laco").innerHTML = d;
    })();
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const play = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    function idYoutube(link) {
      if (!link) return "";
      const achado = String(link).match(/(?:video\/|v=|shorts\/|youtu\.be\/|embed\/)([\w-]{11})/);
      return achado ? achado[1] : (/^[\w-]{11}$/.test(link) ? link : "");
    }
    function trocarCapa(img) { if (img.dataset.reserva) { img.src = img.dataset.reserva; img.removeAttribute("data-reserva"); } }

    function montar(grade, lista) {
      const validos = lista.filter((v) => idYoutube(v.video));
      if (!validos.length) {
        grade.innerHTML = [1, 2, 3].map(() => `<div class="vazio"><div><i aria-hidden="true">🎁</i><b>Em breve</b>Vídeos chegando</div></div>`).join("");
        return;
      }
      grade.innerHTML = validos.map((v) => {
        const id = idYoutube(v.video);
        return `<a class="card" href="https://www.youtube.com/watch?v=${id}" data-video="${id}" data-titulo="${esc(v.titulo)}" aria-label="Assistir vídeo: ${esc(v.titulo)}${v.marca ? ", " + esc(v.marca) : ""}">
          <img src="https://i.ytimg.com/vi/${id}/oardefault.jpg" data-reserva="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"
               onerror="trocarCapa(this)" onload="if(this.naturalWidth<=120)trocarCapa(this)">
          <span class="play" aria-hidden="true">${play}</span>
          <div class="info" aria-hidden="true"><h3>${esc(v.titulo)}</h3>${v.marca ? `<p class="marca">${esc(v.marca)}</p>` : ""}</div>
        </a>`;
      }).join("");
    }
    $("#descNatal").textContent = SAZONAL.natal.texto;
    $("#descBF").textContent = SAZONAL.blackFriday.texto;
    montar($("#gradeNatal"), SAZONAL.natal.itens);
    montar($("#gradeBF"), SAZONAL.blackFriday.itens);
    $("#direitos").textContent = `© ${new Date().getFullYear()} PRISSILA KIESKI · UGC · Micro influ`;

    // Abertura de presente: some depois da animação
    setTimeout(() => $("#presente").classList.add("aberto"), 2800);

    // Neve caindo: flocos de tamanhos, velocidades e desvios diferentes
    const movimentoReduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!movimentoReduzido) {
      const neve = $("#neve");
      const qtd = window.innerWidth < 600 ? 40 : 80;
      let flocos = "";
      for (let i = 0; i < qtd; i++) {
        const tam = (2 + Math.random() * 5).toFixed(1);
        flocos += `<span class="floco" style="left:${(Math.random() * 100).toFixed(2)}%;width:${tam}px;height:${tam}px;opacity:${(0.45 + Math.random() * 0.5).toFixed(2)};--deriva:${(Math.random() * 60 - 30).toFixed(0)}px;animation-duration:${(8 + Math.random() * 12).toFixed(1)}s;animation-delay:-${(Math.random() * 20).toFixed(1)}s"></span>`;
      }
      neve.innerHTML = flocos;
    }

    // Player: o vídeo toca dentro da página
    const janela = $("#janela"), moldura = $("#moldura");
    document.addEventListener("click", (e) => {
      const card = e.target.closest("[data-video]");
      if (!card) return;
      e.preventDefault();
      $("#tituloVideo").textContent = card.dataset.titulo;
      if (location.protocol === "file:") {
        moldura.innerHTML = `<p class="aviso-local">O vídeo vai tocar aqui quando o site estiver publicado. Aberto direto do computador, o YouTube bloqueia o player.</p>`;
      } else {
        moldura.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${card.dataset.video}?autoplay=1&rel=0&playsinline=1&origin=${encodeURIComponent(location.origin)}"
          title="${esc(card.dataset.titulo)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      }
      janela.showModal();
    });
    janela.addEventListener("close", () => { moldura.innerHTML = ""; });
    $("#fechar").addEventListener("click", () => janela.close());
    janela.addEventListener("click", (e) => { if (e.target === janela) janela.close(); });
  </script>
</body>
</html>
